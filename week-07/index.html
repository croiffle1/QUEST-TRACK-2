<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동네 맛집 평점판</title>
<style>
  :root {
    --bg: #f3f9fd; --card: #ffffff; --ink: #0f2233; --muted: #47596b; --line: #d3e5f2; --field: #8fb0c8;
    --brand: #0369a1; --brand-ink: #ffffff; --soft: #e6f3fb; --bar: #0ea5e9;
    --star: #f59e0b; --star-off: #d3dfe9; --bad: #b42318;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 1.0625rem/1.65 system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; overflow-wrap: anywhere; }
  a { color: inherit; }
  h1, h2, h3, p { margin: 0; }
  img { max-width: 100%; height: auto; }
  ::placeholder { color: #5b6e80; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

  /* 위쪽 줄: 이름 · 메뉴 · 로그인 자리 */
  .top { background: var(--card); border-bottom: 1px solid var(--line); }
  .top-in { max-width: 960px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
  .brand { font-weight: 800; font-size: 1.2rem; color: var(--brand); text-decoration: none; margin-right: auto; }
  .login-slot { order: 1; border: 2px dashed var(--field); border-radius: 999px; padding: 4px 14px; color: var(--muted); font-size: .95rem; white-space: nowrap; }
  .login-slot.on { border-style: solid; padding: 0; border-color: transparent; }
  .login-slot .btn { min-height: 40px; padding: 4px 16px; }
  .nav { order: 2; width: 100%; display: flex; gap: 8px; }
  .nav a { flex: 1 1 0; text-align: center; padding: 10px 6px; border-radius: 10px; text-decoration: none; font-weight: 700; color: var(--brand); background: var(--soft); }
  .nav a[aria-current="page"] { background: var(--brand); color: var(--brand-ink); }
  @media (min-width: 720px) {
    .top { position: sticky; top: 0; z-index: 5; }
    .nav { order: 1; width: auto; }
    .nav a { flex: none; padding: 10px 18px; }
    .login-slot { order: 2; }
  }

  main { max-width: 960px; margin: 0 auto; padding: 20px 16px 56px; }
  footer { max-width: 960px; margin: 0 auto; padding: 0 16px 36px; color: var(--muted); font-size: .9rem; }
  h1 { font-size: 1.6rem; line-height: 1.3; letter-spacing: -.01em; }
  h2 { font-size: 1.2rem; line-height: 1.35; }
  h3 { font-size: 1.05rem; }
  .sub, .hint { color: var(--muted); font-size: .95rem; }
  .intro { margin-bottom: 16px; display: grid; gap: 4px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .back { display: inline-block; margin-bottom: 12px; color: var(--brand); font-weight: 600; padding: 6px 0; }

  /* 단추 · 입력칸 */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: inherit; font-weight: 700; padding: 10px 18px; min-height: 46px; border-radius: 10px;
         border: 1px solid var(--field); background: var(--card); color: var(--brand); cursor: pointer; text-decoration: none; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .btn.small { min-height: 42px; padding: 6px 14px; }
  .btn[disabled] { opacity: .6; cursor: default; }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field > span, legend { font-weight: 700; font-size: .95rem; }
  input, select, textarea { font: inherit; color: inherit; background: #fff; border: 1px solid var(--field); border-radius: 10px; padding: 10px 12px; min-height: 46px; width: 100%; min-width: 0; }
  textarea { resize: vertical; min-height: 110px; }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  .form { display: grid; gap: 16px; }
  .msg { color: var(--bad); font-weight: 700; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
  .grow { flex: 1 1 220px; }

  /* 별 */
  .stars { display: inline-block; font-size: 1.15rem; line-height: 1; letter-spacing: 1px; color: transparent; white-space: nowrap;
           background: linear-gradient(90deg, var(--star) var(--p, 0%), var(--star-off) var(--p, 0%)); -webkit-background-clip: text; background-clip: text; }
  .star-pick { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .star-btn { font-size: 2rem; line-height: 1; width: 48px; height: 48px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--star-off); cursor: pointer; padding: 0; }
  .star-btn.on { color: var(--star); border-color: var(--star); }
  .star-word { font-weight: 700; margin-left: 6px; }

  /* 프로필 그림 */
  .av { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 50%; font-size: 1.4rem; flex: none; border: 1px solid rgba(15,34,51,.1); }
  .av.sm { width: 32px; height: 32px; font-size: 1.1rem; }
  .av.lg { width: 64px; height: 64px; font-size: 2.2rem; }
  .pick { display: flex; flex-wrap: wrap; gap: 8px; }
  .pick button { width: 46px; height: 46px; border-radius: 10px; border: 2px solid var(--line); background: #fff; font-size: 1.4rem; cursor: pointer; padding: 0; }
  .pick button.on { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand); }
  .pick.colors button { border-radius: 50%; }
  .preview { display: flex; align-items: center; gap: 12px; }

  /* 평균 점수: 화면에서 가장 크게 */
  .avg-num { color: var(--brand); font-weight: 800; line-height: 1; }
  .rating, .avg-big { display: grid; grid-template-columns: auto 1fr; grid-template-areas: "num stars" "num count"; column-gap: 14px; row-gap: 2px; align-items: center; }
  .rating .avg-num, .avg-big .avg-num { grid-area: num; }
  .rating .stars, .avg-big .stars { grid-area: stars; align-self: end; }
  .rating .count, .avg-big .count { grid-area: count; align-self: start; }
  .rating .count:only-child { grid-area: auto; grid-column: 1 / -1; }
  .rating .avg-num { font-size: 2.9rem; }
  .avg-big .avg-num { font-size: 3.9rem; }

  /* 가게 목록 */
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); }
  .shop-card { display: grid; gap: 10px; align-content: start; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; text-decoration: none; min-width: 0; }
  .shop-card:hover { border-color: var(--brand); }
  .shop-card .shop-name { font-size: 1.15rem; }
  .count, .menus, .snippet, time { color: var(--muted); font-size: .92rem; }
  .snippet { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .empty { text-align: center; padding: 36px 16px; color: var(--muted); display: grid; gap: 14px; justify-items: center; }

  /* 가게 자세히 */
  .shop-head { display: grid; gap: 14px; }
  .shop-head h1 { font-size: 1.7rem; }
  .sum-grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); margin-top: 4px; }
  .dist-row { display: grid; grid-template-columns: 2.4em 1fr 2.2em; align-items: center; gap: 8px; font-size: .95rem; }
  .dist-row .num { text-align: right; }
  .bar { height: 12px; background: var(--soft); border-radius: 6px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--bar); border-radius: 6px; }
  .pop { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
  .pop li { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
  .pop li b { font-weight: 700; }
  .list-title { margin: 22px 0 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }

  /* 리뷰 · 댓글 */
  .review { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; display: grid; gap: 12px; }
  .r-main { display: grid; gap: 10px; }
  .r-main.has-photo, .my-review.has-photo { cursor: pointer; }
  .r-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .r-who { display: grid; min-width: 0; }
  .r-stars { margin-left: auto; }
  .chip { display: inline-block; background: var(--soft); color: var(--brand); border-radius: 999px; padding: 2px 12px; font-size: .95rem; font-weight: 700; }
  .r-text { white-space: pre-wrap; }
  .photo-hint { display: inline-flex; align-items: center; gap: 6px; color: var(--brand); font-weight: 700; font-size: .95rem; min-height: 36px; }
  .photo-hint::before { content: "▸"; }
  [aria-expanded="true"] > .photo-hint::before { content: "▾"; }
  .has-photo:hover > .photo-hint { text-decoration: underline; }
  .r-photo { width: 100%; max-height: 440px; object-fit: cover; border-radius: 10px; display: block; }
  .my-review .r-photo { max-width: 300px; }
  .comments { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 10px; }
  .comments ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .comment { display: flex; gap: 10px; align-items: flex-start; }
  .comment > div { min-width: 0; }
  .c-head b { font-size: .98rem; }
  .c-form { display: flex; gap: 8px; }
  .c-form input { flex: 1 1 auto; }

  /* 내 프로필 */
  .my-shop { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; display: grid; gap: 12px; }
  .my-shop > header { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; }
  .my-review { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 6px; }
  .my-review .top-line { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }

  /* 가게 주인 · 매너온도 */
  .badge { display: inline-block; background: var(--brand); color: var(--brand-ink); border-radius: 999px; padding: 0 10px; font-size: .9rem; font-weight: 700; line-height: 1.6; }
  .owner-box { background: var(--soft); border-radius: 10px; padding: 14px; display: grid; gap: 10px; }
  .owner-box .who { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  .temp { display: grid; gap: 6px; }
  .temp-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
  .temp-num { font-size: 1.4rem; color: var(--brand); }
  .temp-bar { background: #fff; max-width: 320px; }
  .react { display: flex; gap: 8px; margin-top: 6px; }
  .react-btn { font: inherit; font-size: .95rem; min-height: 38px; padding: 2px 14px; border-radius: 999px; border: 1px solid var(--field); background: #fff; color: var(--ink); cursor: pointer; }
  .react-btn.on { border-color: var(--brand); background: var(--soft); font-weight: 700; }
  .react-btn[disabled] { opacity: .7; cursor: default; }
  .owned-list { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: calc(100vw - 32px); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 600; z-index: 10; }
  #toast[hidden] { display: none; }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/">동네 맛집 평점판</a>
    <!-- 로그인은 나중에 이 자리에 붙인다. 로그인한 상태에서는 이 자리가 [로그아웃] 단추로 바뀐다. (로그인은 아직 없음) -->
    <div id="login-slot" class="login-slot">로그인 자리</div>
    <nav class="nav" aria-label="메뉴">
      <a href="#/" data-nav="home">맛집</a>
      <a href="#/write" data-nav="write">리뷰 쓰기</a>
      <a href="#/me" data-nav="me">내 프로필</a>
    </nav>
  </div>
</header>
<main id="view"></main>
<footer>남긴 리뷰는 지금은 이 기기의 브라우저에만 저장돼요. 전화번호나 주소 같은 개인 정보는 적지 마세요.</footer>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="store.js"></script>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const view = $("#view");

const EMOJIS = ["🐶", "🐱", "🐰", "🐻", "🦊", "🐼", "🐯", "🐸", "🐧", "🦁", "🐹", "🐨"];
const COLORS = ["#ffd6a5", "#fdffb6", "#caffbf", "#9bf6ff", "#a0c4ff", "#ffc6ff"];
const COLOR_NAMES = ["살구색", "연노랑", "연두", "하늘", "파랑", "분홍"];
const STAR_WORDS = ["", "별로예요", "그저 그래요", "괜찮아요", "맛있어요", "최고예요"];

// 화면이 기억하는 것 (저장은 안 함)
const ui = { q: "", min: 0, sort: "avg" };
let wdraft = { stars: 0, photo: null, busy: false };
let pdraft = { emoji: EMOJIS[0], color: COLORS[0] };

// ── 작은 도우미 ──
function fmtDate(ts) { const d = new Date(ts); return isNaN(d) ? "" : `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`; }
function stars(v) {
  return `<span class="stars" role="img" aria-label="별 5개 중 ${v.toFixed(1)}개" style="--p:${(v / 5) * 100}%">★★★★★</span>`;
}
function avatar(a, size = "") {
  return `<span class="av ${size}" style="background:${esc(a.color)}" aria-hidden="true">${esc(a.emoji)}</span>`;
}
let toastTimer = 0;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3500);
}

// 사장님 매너온도: 기본 36.5°C. 서로 다른 리뷰에 사장님 답글을 달면 리뷰마다 +0.5,
// 내 답글에 좋아요 +0.2, 싫어요 -0.3. 0 ~ 99.9 사이. (같은 리뷰에 답글을 여러 번 달아도 한 번만 셈)
function mannerOf(ownerId) {
  let replied = 0, likes = 0, dislikes = 0;
  for (const r of Store.getReviews()) {
    const mine = r.comments.filter((c) => c.owner && c.author.id === ownerId);
    if (mine.length) replied++;
    for (const c of mine) { likes += c.likes.length; dislikes += c.dislikes.length; }
  }
  const t = Math.min(99.9, Math.max(0, 36.5 + replied * 0.5 + likes * 0.2 - dislikes * 0.3));
  return { temp: Math.round(t * 10) / 10, replied, likes, dislikes };
}
function tempHTML(ownerId) {
  const m = mannerOf(ownerId);
  return `<div class="temp"><div class="temp-top"><b class="temp-num">${m.temp.toFixed(1)}°C</b><span class="count">사장님 매너온도</span></div>
    <div class="bar temp-bar"><span style="width:${Math.min(100, m.temp)}%"></span></div>
    <p class="count temp-detail">답글 단 리뷰 ${m.replied}개 · 좋아요 ${m.likes} · 싫어요 ${m.dislikes}</p></div>`;
}

// 리뷰들을 가게별로 묶고 평균 · 별점 분포 · 인기 메뉴를 셈한다
function groupShops() {
  const map = new Map();
  for (const r of Store.getReviews()) {           // 새 리뷰가 앞, 그래서 마지막에 본 이름이 가장 처음 적은 이름
    const key = Store.shopKey(r.shop);
    let s = map.get(key);
    if (!s) { s = { key, name: r.shop, reviews: [], sum: 0, dist: [0, 0, 0, 0, 0], menus: new Map() }; map.set(key, s); }
    s.name = r.shop; s.reviews.push(r); s.sum += r.stars; s.dist[r.stars - 1]++;
    const mk = r.menu.trim().replace(/\s+/g, " ").toLowerCase();
    const m = s.menus.get(mk) || { name: r.menu, count: 0, sum: 0 };
    m.name = r.menu; m.count++; m.sum += r.stars; s.menus.set(mk, m);
  }
  const owners = Store.getOwners();
  for (const [key, o] of Object.entries(owners))       // 주인이 등록만 하고 아직 리뷰가 없는 가게
    if (!map.has(key)) map.set(key, { key, name: o.name, reviews: [], sum: 0, dist: [0, 0, 0, 0, 0], menus: new Map() });
  for (const s of map.values()) {
    s.owner = owners[s.key] || null;
    s.count = s.reviews.length; s.avg = s.count ? s.sum / s.count : 0;
    s.last = s.count ? Math.max(...s.reviews.map((r) => r.createdAt)) : (s.owner ? s.owner.registeredAt : 0);
    s.photo = (s.reviews.find((r) => r.photo) || {}).photo || null;
    s.popular = [...s.menus.values()].sort((a, b) => b.count - a.count || b.sum / b.count - a.sum / a.count);
  }
  return [...map.values()];
}

// ── 위쪽 로그인 자리: 로그인한 상태면 [로그아웃] 단추, 아니면 "로그인 자리" 글자만 ──
function paintLoginSlot() {
  const slot = $("#login-slot"), on = !!Store.getSession();
  slot.classList.toggle("on", on);
  slot.innerHTML = on ? `<button type="button" class="btn" id="logout-btn">로그아웃</button>` : "로그인 자리";
}
$("#login-slot").addEventListener("click", (e) => {
  if (!e.target.closest("#logout-btn")) return;
  const res = Store.logout();
  if (!res.ok) { toast(res.message); return; }
  paintLoginSlot(); toast("로그아웃했어요.");
});

// ── 길 찾기 (주소의 # 뒤를 보고 화면을 고른다) ──
function route(keepScroll = false) {
  paintLoginSlot();
  const h = location.hash.replace(/^#/, "") || "/";
  const [path, qs = ""] = h.split("?");
  const parts = path.split("/").filter(Boolean);
  const dec = (s) => { try { return decodeURIComponent(s); } catch (e) { return s; } };
  let nav = "home";
  if (parts[0] === "shop" && parts[1]) viewShop(dec(parts[1]));
  else if (parts[0] === "write") { nav = "write"; viewWrite(new URLSearchParams(qs).get("shop") || ""); }
  else if (parts[0] === "me") { nav = "me"; viewMe(); }
  else viewHome();
  $$(".nav a").forEach((a) => (a.dataset.nav === nav ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
  document.title = "동네 맛집 평점판";
  if (!keepScroll) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => { openPhotos.clear(); route(); });
// 다른 탭에서 바뀌면 목록 화면은 새로 그린다 (글 쓰는 중인 화면은 건드리지 않음)
window.addEventListener("storage", () => {
  Store.reload(); paintLoginSlot();
  if ($("#shop-list") || $("#shop-detail")) route(true);
});

// ── 1. 맛집 목록: 검색 · 별점 거르기 · 순서 ──
function viewHome() {
  const n = groupShops().length, m = Store.getReviews().length, has = m > 0 || n > 0;
  view.innerHTML = `
    <section class="intro">
      <h1>우리 동네 맛집 평점판</h1>
      <p class="sub">${has ? `가게 ${n}곳 · 리뷰 ${m}개` : "가게마다 별점과 한 줄 평을 남겨 보세요."}</p>
    </section>
    ${has ? `
    <div class="row panel">
      <label class="field grow"><span>가게나 메뉴 찾기</span><input id="q" type="search" placeholder="가게 이름이나 메뉴" value="${esc(ui.q)}"></label>
      <label class="field"><span>평균 별점</span>
        <select id="min">${[[0, "전체"], [4, "4점 이상"], [3, "3점 이상"], [2, "2점 이상"]].map(([v, t]) => `<option value="${v}"${ui.min === v ? " selected" : ""}>${t}</option>`).join("")}</select></label>
      <label class="field"><span>순서</span>
        <select id="sort">${[["avg", "평균 높은 순"], ["new", "최신순"], ["count", "리뷰 많은 순"]].map(([v, t]) => `<option value="${v}"${ui.sort === v ? " selected" : ""}>${t}</option>`).join("")}</select></label>
      <a class="btn primary" href="#/write">리뷰 쓰기</a>
    </div>
    <p class="sub" id="found" aria-live="polite"></p>
    <div id="shop-list" class="grid"></div>` : `
    <div class="panel empty" id="empty-all">
      <p>아직 리뷰가 없어요. 첫 리뷰를 남겨 보세요!</p>
      <a class="btn primary" href="#/write">리뷰 쓰기</a>
    </div>`}`;
  if (has) paintShops();
}
function paintShops() {

const photoAttrs = (r) => (r.photo ? ` has-photo" data-id="${esc(r.id)}" role="button" tabindex="0" aria-expanded="${openPhotos.has(r.id)}` : "");
function togglePhoto(el) {

function reactBtn(r, c, kind) {

    : "";

// 사진은 저장 공간이 작아서 긴 쪽 800px 이하로 줄여 JPEG 로 저장한다
async function shrink(file) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 800 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(bmp.width * scale)); c.height = Math.max(1, Math.round(bmp.height * scale));
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.7);
}

// ── 눌렀을 때 · 쓸 때 · 보낼 때 ──
view.addEventListener("click", (e) => {
  const pm = e.target.closest(".has-photo");
  if (pm) { togglePhoto(pm); return; }
  const star = e.target.closest(".star-btn");
  if (star) { wdraft.stars = +star.dataset.v; paintStars(); return; }
  const em = e.target.closest(".emoji-btn");
  if (em) { pdraft.emoji = em.dataset.emoji; paintProfile(); return; }
  const co = e.target.closest(".color-btn");
  if (co) { pdraft.color = co.dataset.color; paintProfile(); return; }
  const rb = e.target.closest(".react-btn");
  if (rb) {
    const y = window.scrollY, res = Store.react(rb.dataset.review, rb.dataset.comment, rb.dataset.kind);
    if (!res.ok) { toast(res.message); return; }
    route(true); window.scrollTo(0, y); return;
  }
  const claim = e.target.closest("#claim-btn");
  if (claim) {
    const res = Store.registerShop(claim.dataset.shop);
    if (!res.ok) { toast(res.message); return; }
    toast("내 가게로 등록했어요."); route(true); return;
  }
  if (e.target.closest(".photo-clear")) { wdraft.photo = null; $("#photo").value = ""; paintPhoto(); }
});
view.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("has-photo")) { e.preventDefault(); togglePhoto(e.target); }
});
view.addEventListener("input", (e) => {
  if (e.target.id === "q") { ui.q = e.target.value; paintShops(); }
  else if (e.target.closest("#profile-form") && e.target.name === "name") paintProfile();
});
view.addEventListener("change", async (e) => {
  if (e.target.id === "min") { ui.min = +e.target.value; paintShops(); }
  else if (e.target.id === "sort") { ui.sort = e.target.value; paintShops(); }
  else if (e.target.id === "photo") {
    const file = e.target.files[0];
    $("#form-msg").textContent = "";
    if (!file) { wdraft.photo = null; paintPhoto(); return; }
    wdraft.busy = true;
    try { wdraft.photo = await shrink(file); }
    catch (err) { wdraft.photo = null; e.target.value = ""; $("#form-msg").textContent = "이 사진은 열 수 없어요. 다른 사진을 골라 주세요."; }

view.addEventListener("submit", (e) => {
  e.preventDefault();

  else if (f.classList.contains("c-form")) sendComment(f);

function sendReview(f) {
  const msg = $("#form-msg"), v = (n) => f.elements[n].value.trim().replace(/[ \t]+/g, " ");
  const shop = v("shop"), menu = v("menu"), text = f.elements.text.value.trim();
  const problem = !shop ? "가게 이름을 적어 주세요." : !menu ? "시킨 메뉴를 적어 주세요." : !wdraft.stars ? "별점을 눌러 주세요."
    : !text ? "리뷰를 한 줄이라도 적어 주세요." : wdraft.busy ? "사진을 줄이는 중이에요. 잠깐만 기다려 주세요." : "";
  if (problem) { msg.textContent = problem; return; }
  const res = Store.addReview({ shop, menu, stars: wdraft.stars, text, photo: wdraft.photo });
  if (!res.ok) { msg.textContent = res.message; toast(res.message); return; }
  location.hash = "#/shop/" + encodeURIComponent(Store.shopKey(shop));
  toast("리뷰를 남겼어요.");
}
function sendProfile(f) {
  const name = f.elements.name.value.trim().replace(/\s+/g, " ");
  if (!name) { $("#form-msg").textContent = "이름을 적어 주세요."; return; }
  const res = Store.saveProfile({ name, emoji: pdraft.emoji, color: pdraft.color });
  if (!res.ok) { $("#form-msg").textContent = res.message; toast(res.message); return; }
  toast("프로필을 저장했어요.");
  route(true);
}
function sendShop(f) {
  const res = Store.registerShop(f.elements.shop.value);
  if (!res.ok) { $("#shop-msg").textContent = res.message; return; }
  toast("내 가게로 등록했어요."); route(true);
}
function sendComment(f) {
  const text = f.elements.text.value.trim();
  if (!text) { f.elements.text.focus(); return; }
  const id = f.dataset.review, y = window.scrollY;
  const res = Store.addComment(id, text);
  if (!res.ok) { toast(res.message); return; }
  route(true); window.scrollTo(0, y);
  const next = $(`.c-form[data-review="${CSS.escape(id)}"] input`); if (next) next.focus({ preventScroll: true });
}

route();
</script>
</body>
</html>
