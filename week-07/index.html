<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동네 맛집 평점판</title>
<style>
  :root {
    --bg: #f3f9fd; --card: #ffffff; --ink: #0f2233; --muted: #47596b; --line: #d3e5f2; --field: #8fb0c8;
    --brand: #0369a1; --brand-ink: #ffffff; --soft: #e6f3fb; --bar: #0ea5e9;
    --star: #f59e0b; --star-off: #d3dfe9; --bad: #b42318;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 1.0625rem/1.65 system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; overflow-wrap: anywhere; }
  a { color: inherit; }
  h1, h2, h3, p { margin: 0; }
  img { max-width: 100%; height: auto; }
  ::placeholder { color: #5b6e80; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

  /* 위쪽 줄: 이름 · 메뉴 · 로그인 자리 */
  .top { background: var(--card); border-bottom: 1px solid var(--line); }
  .top-in { max-width: 960px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
  .brand { font-weight: 800; font-size: 1.2rem; color: var(--brand); text-decoration: none; margin-right: auto; }
  .login-slot { order: 1; display: flex; align-items: center; gap: 8px; font-size: .95rem; min-width: 0; }
  .me-name { display: inline-flex; align-items: center; gap: 6px; min-width: 0; color: var(--ink); text-decoration: none; }
  .me-name b { max-width: 8em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  a.me-name { color: var(--brand); font-weight: 700; }
  .login-slot .btn { min-height: 40px; padding: 4px 16px; }
  .nav { order: 2; width: 100%; display: flex; gap: 8px; }
  .nav a { flex: 1 1 0; text-align: center; padding: 10px 6px; border-radius: 10px; text-decoration: none; font-weight: 700; color: var(--brand); background: var(--soft); }
  .nav a[aria-current="page"] { background: var(--brand); color: var(--brand-ink); }
  @media (min-width: 720px) {
    .top { position: sticky; top: 0; z-index: 5; }
    .nav { order: 1; width: auto; }
    .nav a { flex: none; padding: 10px 18px; }
    .login-slot { order: 2; }
  }

  main { max-width: 960px; margin: 0 auto; padding: 20px 16px 56px; }
  footer { max-width: 960px; margin: 0 auto; padding: 0 16px 36px; color: var(--muted); font-size: .9rem; }
  h1 { font-size: 1.6rem; line-height: 1.3; letter-spacing: -.01em; }
  h2 { font-size: 1.2rem; line-height: 1.35; }
  h3 { font-size: 1.05rem; }
  .sub, .hint { color: var(--muted); font-size: .95rem; }
  .intro { margin-bottom: 16px; display: grid; gap: 4px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .back { display: inline-block; margin-bottom: 12px; color: var(--brand); font-weight: 600; padding: 6px 0; }

  /* 단추 · 입력칸 */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: inherit; font-weight: 700; padding: 10px 18px; min-height: 46px; border-radius: 10px;
         border: 1px solid var(--field); background: var(--card); color: var(--brand); cursor: pointer; text-decoration: none; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .btn.small { min-height: 42px; padding: 6px 14px; }
  .btn[disabled] { opacity: .6; cursor: default; }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field > span, legend { font-weight: 700; font-size: .95rem; }
  input, select, textarea { font: inherit; color: inherit; background: #fff; border: 1px solid var(--field); border-radius: 10px; padding: 10px 12px; min-height: 46px; width: 100%; min-width: 0; }
  textarea { resize: vertical; min-height: 110px; }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  .form { display: grid; gap: 16px; }
  .msg { color: var(--bad); font-weight: 700; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
  .grow { flex: 1 1 220px; }

  /* 별 */
  .stars { display: inline-block; font-size: 1.15rem; line-height: 1; letter-spacing: 1px; color: transparent; white-space: nowrap;
           background: linear-gradient(90deg, var(--star) var(--p, 0%), var(--star-off) var(--p, 0%)); -webkit-background-clip: text; background-clip: text; }
  .star-pick { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .star-btn { font-size: 2rem; line-height: 1; width: 48px; height: 48px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--star-off); cursor: pointer; padding: 0; }
  .star-btn.on { color: var(--star); border-color: var(--star); }
  .star-word { font-weight: 700; margin-left: 6px; }

  /* 프로필 그림 */
  .av { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 50%; font-size: 1.4rem; flex: none; border: 1px solid rgba(15,34,51,.1); }
  .av.sm { width: 32px; height: 32px; font-size: 1.1rem; }
  .av.lg { width: 64px; height: 64px; font-size: 2.2rem; }
  .pick { display: flex; flex-wrap: wrap; gap: 8px; }
  .pick button { width: 46px; height: 46px; border-radius: 10px; border: 2px solid var(--line); background: #fff; font-size: 1.4rem; cursor: pointer; padding: 0; }
  .pick button.on { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand); }
  .pick.colors button { border-radius: 50%; }
  .preview { display: flex; align-items: center; gap: 12px; }

  /* 평균 점수: 화면에서 가장 크게 */
  .avg-num { color: var(--brand); font-weight: 800; line-height: 1; }
  .rating, .avg-big { display: grid; grid-template-columns: auto 1fr; grid-template-areas: "num stars" "num count"; column-gap: 14px; row-gap: 2px; align-items: center; }
  .rating .avg-num, .avg-big .avg-num { grid-area: num; }
  .rating .stars, .avg-big .stars { grid-area: stars; align-self: end; }
  .rating .count, .avg-big .count { grid-area: count; align-self: start; }
  .rating .count:only-child { grid-area: auto; grid-column: 1 / -1; }
  .rating .avg-num { font-size: 2.9rem; }
  .avg-big .avg-num { font-size: 3.9rem; }

  /* 가게 목록 */
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); }
  .shop-card { display: grid; gap: 10px; align-content: start; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; text-decoration: none; min-width: 0; }
  .shop-card:hover { border-color: var(--brand); }
  .shop-card .shop-name { font-size: 1.15rem; }
  .count, .menus, .snippet, time { color: var(--muted); font-size: .92rem; }
  .snippet { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .empty { text-align: center; padding: 36px 16px; color: var(--muted); display: grid; gap: 14px; justify-items: center; }

  /* 가게 자세히 */
  .shop-head { display: grid; gap: 14px; }
  .shop-head h1 { font-size: 1.7rem; }
  .sum-grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); margin-top: 4px; }
  .dist-row { display: grid; grid-template-columns: 2.4em 1fr 2.2em; align-items: center; gap: 8px; font-size: .95rem; }
  .dist-row .num { text-align: right; }
  .bar { height: 12px; background: var(--soft); border-radius: 6px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--bar); border-radius: 6px; }
  .pop { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
  .pop li { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
  .pop li b { font-weight: 700; }
  .list-title { margin: 22px 0 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }

  /* 리뷰 · 댓글 */
  .review { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; display: grid; gap: 12px; }
  .r-main { display: grid; gap: 10px; }
  .r-main.has-photo, .my-review.has-photo { cursor: pointer; }
  .r-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .r-who { display: grid; min-width: 0; }
  .r-stars { margin-left: auto; }
  .chip { display: inline-block; background: var(--soft); color: var(--brand); border-radius: 999px; padding: 2px 12px; font-size: .95rem; font-weight: 700; }
  .r-text { white-space: pre-wrap; }
  .photo-hint { display: inline-flex; align-items: center; gap: 6px; color: var(--brand); font-weight: 700; font-size: .95rem; min-height: 36px; }
  .photo-hint::before { content: "▸"; }
  [aria-expanded="true"] > .photo-hint::before { content: "▾"; }
  .has-photo:hover > .photo-hint { text-decoration: underline; }
  .r-photo { width: 100%; max-height: 440px; object-fit: cover; border-radius: 10px; display: block; }
  .my-review .r-photo { max-width: 300px; }
  .comments { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 10px; }
  .comments ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .comment { display: flex; gap: 10px; align-items: flex-start; }
  .comment > div { min-width: 0; }
  .c-head b { font-size: .98rem; }
  .c-form { display: flex; gap: 8px; }
  .c-form input { flex: 1 1 auto; }

  /* 내 프로필 */
  .my-shop { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; display: grid; gap: 12px; }
  .my-shop > header { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; }
  .my-review { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 6px; }
  .my-review .top-line { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }

  /* 가게 주인 · 매너온도 */
  .badge { display: inline-block; background: var(--brand); color: var(--brand-ink); border-radius: 999px; padding: 0 10px; font-size: .9rem; font-weight: 700; line-height: 1.6; }
  .owner-box { background: var(--soft); border-radius: 10px; padding: 14px; display: grid; gap: 10px; }
  .owner-box .who { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  .temp { display: grid; gap: 6px; }
  .temp-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
  .temp-num { font-size: 1.4rem; color: var(--brand); }
  .temp-bar { background: #fff; max-width: 320px; }
  .react { display: flex; gap: 8px; margin-top: 6px; }
  .react-btn { font: inherit; font-size: .95rem; min-height: 38px; padding: 2px 14px; border-radius: 999px; border: 1px solid var(--field); background: #fff; color: var(--ink); cursor: pointer; }
  .react-btn.on { border-color: var(--brand); background: var(--soft); font-weight: 700; }
  .react-btn[disabled] { opacity: .7; cursor: default; }
  .owned-list { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

  /* 처음 온 사람을 위한 안내 · 가게 고르기 · 고치기/지우기 */
  .steps { margin: 0; padding-left: 1.4em; display: grid; gap: 4px; text-align: left; color: var(--ink); }
  .shop-help { display: grid; gap: 8px; }
  .shop-hint { background: var(--soft); border-radius: 10px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .shop-picks { display: flex; flex-wrap: wrap; gap: 8px; }
  .pick-shop { font: inherit; font-size: .95rem; font-weight: 700; min-height: 40px; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--field); background: #fff; color: var(--brand); cursor: pointer; max-width: 100%; text-align: left; }
  .r-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
  details.panel > summary { cursor: pointer; font-weight: 800; color: var(--brand); font-size: 1.05rem; min-height: 44px; display: flex; align-items: center; }
  details.panel[open] > summary { margin-bottom: 12px; }
  .temp-help summary { cursor: pointer; color: var(--brand); font-weight: 700; font-size: .95rem; min-height: 40px; display: flex; align-items: center; }
  .temp-help p { color: var(--muted); font-size: .95rem; }
  /* 오류 글 (로그인 · 저장이 안 될 때) */
  .banner-wrap { max-width: 960px; margin: 0 auto; padding: 12px 16px 0; }
  .banner { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; background: #fdecea; border: 1px solid #f0b4af; color: #7a1710; border-radius: 10px; padding: 12px 14px; font-weight: 600; }
  .banner[hidden] { display: none; }
  .banner p { flex: 1 1 240px; min-width: 0; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: calc(100vw - 32px); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 600; z-index: 10; }
  #toast[hidden] { display: none; }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/">동네 맛집 평점판</a>
    <!-- 로그인 자리: 로그인 전에는 [Google 로 로그인], 로그인하면 내 별명과 [로그아웃] 이 들어온다 -->
    <div id="login-slot" class="login-slot"></div>
    <nav class="nav" aria-label="메뉴">
      <a href="#/" data-nav="home">맛집</a>
      <a href="#/write" data-nav="write">리뷰 쓰기</a>
      <a href="#/me" data-nav="me">내 프로필</a>
    </nav>
  </div>
</header>
<div class="banner-wrap"><div id="banner" class="banner" role="alert" hidden><p id="banner-text"></p><button type="button" class="btn small" id="banner-close">닫기</button></div></div>
<main id="view"><p class="sub" id="boot">불러오는 중…</p></main>
<footer>남긴 리뷰는 인터넷 보관함에 저장돼서 누구나 볼 수 있어요. 별명과 리뷰는 모두에게 보이니, 전화번호나 주소 같은 개인 정보는 적지 마세요. Google 이름과 메일은 저장하지 않아요.</footer>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
  // 파일을 직접 열었거나 화면이 시작되지 못했을 때 빈 화면 대신 까닭을 보여 준다
  (function () {
    function say(text) {
      var boot = document.getElementById("boot");
      if (boot) boot.outerHTML = '<div class="panel empty" id="boot-error"><p>' + text + "</p></div>";
    }
    if (location.protocol === "file:") document.addEventListener("DOMContentLoaded", function () { say("이 작품은 GitHub Pages 주소로 열어 주세요. 파일을 직접 열면 로그인과 보관함이 안 돼요."); });
    else setTimeout(function () { say("화면을 시작하지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요."); }, 12000);
  })();
</script>
<script type="module">
import { Store } from "./store.js";

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const view = $("#view");

const EMOJIS = ["🐶", "🐱", "🐰", "🐻", "🦊", "🐼", "🐯", "🐸", "🐧", "🦁", "🐹", "🐨"];
const COLORS = ["#ffd6a5", "#fdffb6", "#caffbf", "#9bf6ff", "#a0c4ff", "#ffc6ff"];
const COLOR_NAMES = ["살구색", "연노랑", "연두", "하늘", "파랑", "분홍"];
const STAR_WORDS = ["", "별로예요", "그저 그래요", "괜찮아요", "맛있어요", "최고예요"];

// 화면이 기억하는 것 (저장은 안 함)
const ui = { q: "", min: 0, sort: "avg" };
// photo: undefined = 고치는 중이고 올렸던 사진을 그대로 둠, null = 사진 없음(또는 빼기), 글자 = 새로 고른 사진
let wdraft = { stars: 0, photo: null, busy: false, editId: null };
let pdraft = { emoji: EMOJIS[0], color: COLORS[0] };

// ── 작은 도우미 ──
function fmtDate(ts) { const d = new Date(ts); return isNaN(d) ? "" : `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`; }
function stars(v) {
  return `<span class="stars" role="img" aria-label="별 5개 중 ${v.toFixed(1)}개" style="--p:${(v / 5) * 100}%">★★★★★</span>`;
}
function avatar(a, size = "") {
  return `<span class="av ${size}" style="background:${esc(a.color)}" aria-hidden="true">${esc(a.emoji)}</span>`;
}
let toastTimer = 0;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3500);
}
// 로그인이나 저장이 실패하면 사라지지 않는 오류 글을 위쪽에 보여 준다
function showError(msg) { $("#banner-text").textContent = msg; $("#banner").hidden = false; }
function hideError() { $("#banner").hidden = true; }
Store.onError(showError);
$("#banner-close").addEventListener("click", hideError);
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
const loginBtn = (next = "", shop = "", label = "Google 로 로그인") =>
  `<button type="button" class="btn small primary login-btn" data-next="${esc(next)}" data-shop="${esc(shop)}">${label}</button>`;

// 사장님 매너온도: 기본 36.5°C. 서로 다른 리뷰에 사장님 답글을 달면 리뷰마다 +0.5,
// 내 답글에 좋아요 +0.2, 싫어요 -0.3. 0 ~ 99.9 사이. (같은 리뷰에 답글을 여러 번 달아도 한 번만 셈)
function mannerOf(ownerId) {
  let replied = 0, likes = 0, dislikes = 0;
  for (const r of Store.getReviews()) {
    const mine = r.comments.filter((c) => c.owner && c.author.id === ownerId);
    if (mine.length) replied++;
    for (const c of mine) { likes += c.likes.length; dislikes += c.dislikes.length; }
  }
  const t = Math.min(99.9, Math.max(0, 36.5 + replied * 0.5 + likes * 0.2 - dislikes * 0.3));
  return { temp: Math.round(t * 10) / 10, replied, likes, dislikes };
}
function tempHTML(ownerId) {
  const m = mannerOf(ownerId);
  return `<div class="temp"><div class="temp-top"><b class="temp-num">${m.temp.toFixed(1)}°C</b><span class="count">사장님 매너온도</span></div>
    <div class="bar temp-bar"><span style="width:${Math.min(100, m.temp)}%"></span></div>
    <p class="count temp-detail">답글 단 리뷰 ${m.replied}개 · 좋아요 ${m.likes} · 싫어요 ${m.dislikes}</p>
    <details class="temp-help"><summary>매너온도가 뭐예요?</summary>
      <p>가게 사장님이 손님 리뷰에 얼마나 잘 답해 주는지 보여 주는 온도예요. 기본은 36.5°C 예요.</p>
      <p>서로 다른 리뷰에 답글을 달 때마다 0.5 오르고, 그 답글에 손님이 좋아요를 누르면 0.2씩 더 올라요. 싫어요를 받으면 0.3씩 내려가요.</p></details></div>`;
}

// 리뷰들을 가게별로 묶고 평균 · 별점 분포 · 인기 메뉴를 셈한다 (가게는 가게 번호 r.shopKey 로 구분)
function groupShops() {
  const map = new Map();
  for (const r of Store.getReviews()) {           // 새 리뷰가 앞, 그래서 마지막에 본 이름이 가장 처음 적은 이름
    const key = r.shopKey;
    let s = map.get(key);
    if (!s) { s = { key, name: r.shop, reviews: [], sum: 0, dist: [0, 0, 0, 0, 0], menus: new Map() }; map.set(key, s); }
    s.name = r.shop; s.reviews.push(r); s.sum += r.stars; s.dist[r.stars - 1]++;
    const mk = r.menu.trim().replace(/\s+/g, " ").toLowerCase();
    const m = s.menus.get(mk) || { name: r.menu, count: 0, sum: 0 };
    m.name = r.menu; m.count++; m.sum += r.stars; s.menus.set(mk, m);
  }
  const owners = Store.getOwners();
  for (const [key, o] of Object.entries(owners))       // 주인이 등록만 하고 아직 리뷰가 없는 가게
    if (!map.has(key)) map.set(key, { key, name: o.name, reviews: [], sum: 0, dist: [0, 0, 0, 0, 0], menus: new Map() });
  for (const s of map.values()) {
    s.owner = owners[s.key] || null;
    s.count = s.reviews.length; s.avg = s.count ? s.sum / s.count : 0;
    s.last = s.count ? Math.max(...s.reviews.map((r) => r.createdAt)) : (s.owner ? s.owner.registeredAt : 0);
    s.popular = [...s.menus.values()].sort((a, b) => b.count - a.count || b.sum / b.count - a.sum / a.count);
  }
  return [...map.values()];
}

// ── 위쪽 로그인 자리: 로그인 전엔 [Google 로 로그인], 로그인하면 내 별명과 [로그아웃] ──
function paintLoginSlot() {
  const slot = $("#login-slot"), u = Store.getUser(), p = Store.getProfile();
  if (!Store.status().ready) { slot.innerHTML = ""; return; }
  slot.innerHTML = !u ? loginBtn()
    : `${p ? `<span class="me-name" id="me-name">${avatar(p, "sm")}<b>${esc(p.name)}</b> 님</span>` : `<a class="me-name" id="me-setup" href="#/me">별명 정하기</a>`}
       <button type="button" class="btn small" id="logout-btn">로그아웃</button>`;
}
async function doLogin(btn) {
  const next = btn.dataset.next || "", shop = btn.dataset.shop || "";
  btn.disabled = true;
  const res = await Store.login();
  btn.disabled = false;
  if (!res.ok) { showError(res.message); return; }
  hideError();
  if (!res.hasProfile) {                               // 처음 로그인: 별명부터 정한다
    toast("로그인했어요. 리뷰에 보일 별명을 정해 주세요.");
    go("#/me" + (next ? `?next=${next}${shop ? "&shop=" + encodeURIComponent(shop) : ""}` : ""));
    return;
  }
  toast(`${Store.getProfile().name} 님, 어서 오세요.`);
  if (next === "write") go("#/write" + (shop ? "?shop=" + encodeURIComponent(shop) : ""));
}
document.addEventListener("click", async (e) => {
  const lb = e.target.closest(".login-btn");
  if (lb) { await doLogin(lb); return; }
  if (e.target.closest("#logout-btn")) {
    const res = await Store.logout();
    if (!res.ok) { showError(res.message); return; }
    hideError(); toast("로그아웃했어요.");
  }
});

// ── 길 찾기 (주소의 # 뒤를 보고 화면을 고른다) ──
function route(keepScroll = false) {
  paintLoginSlot();
  lastSig = sig(); pendingRender = false;
  if (!Store.status().ready) { view.innerHTML = `<p class="sub" id="loading">불러오는 중…</p>`; return; }
  const h = location.hash.replace(/^#/, "") || "/";
  const [path, qs = ""] = h.split("?");
  const parts = path.split("/").filter(Boolean);
  const dec = (s) => { try { return decodeURIComponent(s); } catch (e) { return s; } };
  let nav = "home";
  if (parts[0] === "shop" && parts[1]) viewShop(dec(parts[1]));
  else if (parts[0] === "write") { const q = new URLSearchParams(qs); nav = "write"; viewWrite(q.get("shop") || "", q.get("edit") || ""); }
  else if (parts[0] === "me") { const q = new URLSearchParams(qs); nav = "me"; viewMe(q.get("next") || "", q.get("shop") || ""); }
  else viewHome();
  $$(".nav a").forEach((a) => (a.dataset.nav === nav ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
  document.title = "동네 맛집 평점판";
  for (const id of openPhotos) fillSlot(id);
  if (!keepScroll) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => { openPhotos.clear(); route(); });

// 보관함이 바뀌면(내가 쓴 것 · 다른 사람이 쓴 것 · 로그인 · 로그아웃) 화면을 새로 그린다.
// 글 쓰는 중에는 쓰던 글이 지워지지 않게 미뤘다가, 입력칸에서 벗어나면 그린다.
let lastSig = "", pendingRender = false;
const sig = () => { const u = Store.getUser(), p = Store.getProfile(); return [Store.status().ready, u && u.uid, p && p.name + p.emoji + p.color].join("|"); };
Store.onChange(() => {
  paintLoginSlot();
  const changedWho = sig() !== lastSig;
  const typing = document.activeElement && view.contains(document.activeElement) && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && document.activeElement.type !== "file";
  const staticForm = $("#write-form") || $("#profile-form");
  if (typing || (staticForm && !changedWho)) { pendingRender = !staticForm || changedWho; return; }
  route(true);
});
document.addEventListener("focusout", () => { setTimeout(() => { if (pendingRender && !(document.activeElement && view.contains(document.activeElement) && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName))) route(true); }, 0); });

// ── 1. 맛집 목록: 검색 · 별점 거르기 · 순서 ──

      ${p ? `<a class="btn primary" href="#/write">리뷰 쓰기</a>` : u ? `<a class="btn primary" href="#/me?next=write">별명 정하고 리뷰 쓰기</a>` : loginBtn("write", "", "Google 로 로그인하고 리뷰 쓰기")}
    </div>`}`;

}
function paintShops() {
  const q = ui.q.trim().toLowerCase();
  let list = groupShops().filter((s) => s.avg >= ui.min - 1e-9 &&
    (!q || s.name.toLowerCase().includes(q) || [...s.menus.values()].some((x) => x.name.toLowerCase().includes(q))));
  const by = {
    avg: (a, b) => b.avg - a.avg || b.count - a.count || b.last - a.last,        // 같으면 리뷰가 더 많은 가게가 먼저
    new: (a, b) => b.last - a.last,
    count: (a, b) => b.count - a.count || b.avg - a.avg,
  }[ui.sort];
  list.sort(by);
  $("#found").textContent = list.length ? `${list.length}곳을 보여 줘요` : "";

        ${s.owner ? `<p class="menus owner-tag">사장님 등록 · 매너온도 ${mannerOf(s.owner.owner.id).temp.toFixed(1)}°C</p>` : ""}

}

// ── 가게 자세히: 평균 · 별점 분포 · 인기 메뉴 · 리뷰와 댓글 ──
// 리뷰 사진은 처음에는 숨겨 두고, 그 리뷰를 눌렀을 때만 보여 준다. (눌렀을 때 보관함에서 불러옴. 펼친 리뷰는 화면을 다시 그려도 기억함)
const openPhotos = new Set();
const photoMem = new Map();
const photoHint = (open) => (open ? "사진 접기" : "사진 1장 · 눌러서 보기");
const photoHTML = (r, open) => `<p class="photo-hint">${photoHint(open)}</p><div class="photo-slot"></div>`;
const photoAttrs = (r) => (r.hasPhoto ? ` has-photo" data-id="${esc(r.id)}" role="button" tabindex="0" aria-expanded="${openPhotos.has(r.id)}` : "");
async function ensurePhoto(id) {
  if (photoMem.has(id)) return photoMem.get(id);
  const res = await Store.getPhoto(id);
  if (!res.ok) { showError(res.message); return null; }
  if (res.value) photoMem.set(id, res.value);
  return res.value;
}
// 펼친 리뷰의 사진 자리를 채운다 (아직 안 받았으면 "불러오는 중"을 보여 주고 받아 온다)
async function fillSlot(id) {
  const find = () => $(`.has-photo[data-id="${CSS.escape(id)}"]`);
  let el = find(); if (!el) return;
  const r = Store.getReviews().find((x) => x.id === id);
  const slot = $(".photo-slot", el), hint = $(".photo-hint", el);
  const open = openPhotos.has(id);
  el.setAttribute("aria-expanded", String(open)); hint.textContent = photoHint(open);
  if (!open || !r) { slot.innerHTML = ""; return; }
  if (!photoMem.has(id)) {
    slot.innerHTML = `<p class="hint photo-loading">사진을 불러오는 중…</p>`;
    const v = await ensurePhoto(id);
    el = find(); if (!el || !openPhotos.has(id)) return;
    if (!v) { $(".photo-slot", el).innerHTML = `<p class="hint">사진을 불러오지 못했어요.</p>`; return; }
  }
  $(".photo-slot", el).innerHTML = `<img class="r-photo" src="${photoMem.get(id)}" alt="${esc(r.shop)} ${esc(r.menu)} 사진">`;
}
function togglePhoto(el) {
  const id = el.dataset.id;
  openPhotos.has(id) ? openPhotos.delete(id) : openPhotos.add(id);
  fillSlot(id);
}
const actionsHTML = (r) => `<a class="btn small edit-btn" href="#/write?edit=${encodeURIComponent(r.id)}">고치기</a><button type="button" class="btn small del-btn" data-id="${esc(r.id)}">지우기</button>`;
function reactBtn(r, c, kind) {
  const prof = Store.getProfile(), arr = kind === "like" ? c.likes : c.dislikes;
  const mine = !!prof && arr.includes(prof.id), off = !prof || c.author.id === prof.id;   // 로그인 전이거나 내 댓글이면 누를 수 없음
  return `<button type="button" class="react-btn${mine ? " on" : ""}" data-review="${esc(r.id)}" data-comment="${esc(c.id)}" data-kind="${kind}" aria-pressed="${mine}"
    aria-label="${kind === "like" ? "좋아요" : "싫어요"} ${arr.length}개"${off ? " disabled" : ""}>${kind === "like" ? "👍" : "👎"} <span class="n">${arr.length}</span></button>`;
}
function reviewHTML(r) {
  const prof = Store.getProfile(), shopOwner = Store.getOwners()[r.shopKey];
  const isOwner = !!(prof && shopOwner && shopOwner.owner.id === prof.id);
  const comments = r.comments.map((c) => `
    <li class="comment${c.owner ? " by-owner" : ""}">${avatar(c.author, "sm")}
      <div><p class="c-head"><b>${esc(c.author.name)}</b>${c.owner ? ` <span class="badge">사장님</span>` : ""} <time>${fmtDate(c.createdAt)}</time></p><p class="c-text">${esc(c.text)}</p>
        <div class="react">${reactBtn(r, c, "like")}${reactBtn(r, c, "dislike")}</div></div></li>`).join("");
  const form = prof
    ? `<form class="c-form" data-review="${esc(r.id)}" novalidate>
         <input name="text" maxlength="200" placeholder="${isOwner ? "사장님 답글을 남겨 보세요" : "댓글을 남겨 보세요"}" aria-label="${isOwner ? "사장님 답글" : "댓글"}">
         <button class="btn small" type="submit">${isOwner ? "답글 달기" : "달기"}</button></form>`
    : Store.getUser()
      ? `<p class="hint"><a href="#/me">별명을 정하면</a> 댓글을 달 수 있어요.</p>`

  return `
    <article class="review" data-id="${esc(r.id)}">
      <div class="r-main${photoAttrs(r)}">
        <header class="r-head">${avatar(r.author)}
          <div class="r-who"><b class="r-name">${esc(r.author.name)}</b><time>${fmtDate(r.createdAt)}${r.editedAt ? " · 고침" : ""}</time></div>
          <div class="r-stars">${stars(r.stars)}</div></header>
        <p><span class="chip r-menu">${esc(r.menu)}</span></p>
        ${r.text ? `<p class="r-text">${esc(r.text)}</p>` : ""}
        ${r.hasPhoto ? photoHTML(r, openPhotos.has(r.id)) : ""}
      </div>
      ${prof && r.author.id === prof.id ? `<div class="r-actions">${actionsHTML(r)}</div>` : ""}
      <section class="comments" aria-label="댓글">
        <h3 class="c-count">댓글 ${r.comments.length}개</h3>
        ${comments ? `<ul>${comments}</ul>` : ""}${form}
      </section>
    </article>`;
}
function viewShop(key) {

           <p class="hint">먼저 등록한 사람이 주인이 돼요. 진짜 주인인지 확인하는 방법은 아직 없어요.</p></div>`

        </div>
        <div><h3>많이 시킨 메뉴</h3>
          <ul class="pop">${s.popular.length ? s.popular.slice(0, 5).map((m) => `<li><b>${esc(m.name)}</b><span class="count">${m.count}번 · 평균 ${(m.sum / m.count).toFixed(1)}점</span></li>`).join("") : `<li class="count">아직 없어요</li>`}</ul>
        </div>

// ── 2. 리뷰 쓰기: 가게 · 메뉴 · 별점 · 글 · 사진 (한 사람은 한 가게에 한 번만) ──
// 글자만 같고 띄어쓰기만 다른 가게 (예: 행복분식 / 행복 분식) 찾기
const compactKey = (n) => Store.normalizeName(n).replace(/\s/g, "");
function findLookalike(name, shops) {
  if (!name) return null;
  return shops.find((x) => x.key !== Store.shopKey(name) && compactKey(x.name) === compactKey(name)) || null;
}
const myReviewAt = (key) => { const me = Store.getProfile(); return me && Store.getReviews().find((r) => r.author.id === me.id && r.shopKey === key); };
function viewWrite(shopName, editId = "") {

    <h1>${ed ? "리뷰 고치기" : "리뷰 쓰기"}</h1>
    <form id="write-form" class="panel form" novalidate>
      <div class="preview">${avatar(me)}<p>작성자: <b>${esc(me.name)}</b></p></div>
      <div class="field"><label class="field"><span>가게</span><input name="shop" maxlength="30" list="shop-names" autocomplete="off" placeholder="예: 행복 분식" value="${esc(ed ? ed.shop : shopName)}"${ed ? " readonly" : ""}></label>
        ${ed ? `<p class="hint">가게는 바꿀 수 없어요. 다른 가게에 쓰려면 새 리뷰를 써 주세요.</p>` : ""}
        <div id="shop-help" class="shop-help"></div></div>
      <datalist id="shop-names">${names.map((n) => `<option value="${esc(n)}">`).join("")}</datalist>
      <label class="field"><span>시킨 메뉴</span><input name="menu" maxlength="30" autocomplete="off" placeholder="예: 떡볶이" value="${esc(ed ? ed.menu : "")}"></label>
      <fieldset><legend>별점</legend>
        <div class="star-pick" role="radiogroup" aria-label="별점">
          ${[1, 2, 3, 4, 5].map((n) => `<button type="button" class="star-btn" role="radio" aria-checked="false" aria-label="${n}점" data-v="${n}">★</button>`).join("")}
          <span class="star-word" id="star-word"></span>
        </div></fieldset>
      <label class="field"><span>리뷰 (한 줄 평도 좋아요)</span><textarea name="text" maxlength="500" placeholder="어떤 점이 좋았나요?">${esc(ed ? ed.text : "")}</textarea></label>
      <div class="field"><span>사진 (없어도 돼요)</span>
        <input id="photo" type="file" accept="image/*">
        <div id="photo-box"></div></div>
      <p class="msg" id="form-msg" role="alert"></p>
      <div class="r-actions"><button class="btn primary" type="submit" id="send">${ed ? "고친 내용 저장" : "리뷰 남기기"}</button>
        ${ed ? `<a class="btn" href="#/shop/${encodeURIComponent(ed.shopKey)}">그만두기</a>` : ""}</div>
    </form>`;
  paintStars(); paintPhoto(); paintShopHelp();
}
// 가게 칸 아래: 이미 있는 가게 고르기 + 비슷한 이름 알려 주기 + 내가 이미 쓴 가게인지 알려 주기
function paintShopHelp() {
  const box = $("#shop-help"); if (!box) return;
  const typed = $("#write-form [name=shop]").value.trim().replace(/\s+/g, " "), shops = groupShops(), editing = !!wdraft.editId;
  if (editing) { box.innerHTML = ""; return; }
  const like = findLookalike(typed, shops), q = compactKey(typed);
  const dup = typed ? myReviewAt(like ? like.key : Store.shopKey(typed)) : null;
  const picks = shops.filter((x) => !q || compactKey(x.name).includes(q)).sort((x, y) => y.last - x.last).slice(0, 6);
  box.innerHTML = (like ? `<p class="shop-hint" id="shop-hint" role="status">이미 <b>${esc(like.name)}</b> 가게가 있어요. 같은 가게라면 아래 단추를 눌러 주세요.
      <button type="button" class="btn small use-shop" data-name="${esc(like.name)}">그 가게에 쓰기</button></p>` : "")
    + (dup ? `<p class="shop-hint" id="dup-hint" role="status">이미 이 가게에 내 리뷰가 있어요. 한 가게에는 한 번만 별점을 줄 수 있어요.
      <a class="btn small" href="#/write?edit=${encodeURIComponent(dup.id)}">내 리뷰 고치기</a></p>` : "")
    + (picks.length ? `<div><p class="hint">이미 있는 가게 (눌러서 고르기)</p><div class="shop-picks">${picks.map((x) => `<button type="button" class="pick-shop" data-name="${esc(x.name)}">${esc(x.name)}</button>`).join("")}</div></div>` : "");
}
function paintStars() {
  $$(".star-btn").forEach((b) => {
    const on = +b.dataset.v <= wdraft.stars;
    b.classList.toggle("on", on); b.setAttribute("aria-checked", String(+b.dataset.v === wdraft.stars));
  });
  const w = $("#star-word"); if (w) w.textContent = wdraft.stars ? `${wdraft.stars}점 · ${STAR_WORDS[wdraft.stars]}` : "";
}
function paintPhoto() {
  const box = $("#photo-box"); if (!box) return;
  let src = wdraft.photo;
  if (src === undefined) {                           // 고치는 중: 올렸던 사진은 보관함에서 불러온다
    const id = wdraft.editId;
    if (photoMem.has(id)) src = photoMem.get(id);
    else if (wdraft.loaded) { box.innerHTML = `<p class="hint">올렸던 사진을 불러오지 못했어요. (그대로 두면 사진은 유지돼요)</p>`; return; }
    else {
      box.innerHTML = `<p class="hint" id="photo-loading">올렸던 사진을 불러오는 중…</p>`;
      ensurePhoto(id).then(() => { if (wdraft.editId === id) { wdraft.loaded = true; paintPhoto(); } });
      return;
    }
  }
  box.innerHTML = src
    ? `<img id="photo-preview" src="${src}" alt="고른 사진" style="max-width:240px;border-radius:10px;display:block;margin:6px 0"><button type="button" class="btn small photo-clear">사진 빼기</button>`
    : "";
}
// 사진은 저장 공간이 작아서 긴 쪽 800px 이하로 줄여 JPEG 로 저장한다
async function shrink(file) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 800 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(bmp.width * scale)); c.height = Math.max(1, Math.round(bmp.height * scale));
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.7);
}

// ── 3. 내 프로필(별명) + 내가 남긴 리뷰 ──
let pnext = { next: "", shop: "" };          // 별명을 처음 정한 뒤 어디로 갈지
function viewMe(next = "", shop = "") {
  pnext = next === "write" ? { next, shop } : { next: "", shop: "" };
  const me = Store.getProfile(), user = Store.getUser();
  if (!user) {
    view.innerHTML = `<h1>내 프로필</h1><div class="panel empty" id="need-login">
      <p>내 별명과 내가 쓴 리뷰는 Google 로 로그인하면 볼 수 있어요.<br>Google 이름과 메일은 저장하지 않아요.</p>
      ${loginBtn(pnext.next, pnext.shop)}</div>`;
    return;
  }
  pdraft = me ? { emoji: me.emoji, color: me.color } : { emoji: EMOJIS[0], color: COLORS[0] };
  let mine = "";
  if (me) {
    const groups = new Map();
    for (const r of Store.getReviews()) if (r.author.id === me.id) {
      if (!groups.has(r.shopKey)) groups.set(r.shopKey, []);
      groups.get(r.shopKey).push(r);
    }
    const shops = new Map(groupShops().map((s) => [s.key, s]));
    const nComments = Store.getReviews().reduce((n, r) => n + r.comments.filter((c) => c.author.id === me.id).length, 0);
    const nReviews = [...groups.values()].reduce((n, l) => n + l.length, 0);
    mine = `
      <div class="list-title"><h2>내가 남긴 리뷰</h2><span class="sub" id="my-summary">가게 ${groups.size}곳 · 리뷰 ${nReviews}개 · 댓글 ${nComments}개</span></div>
      ${groups.size ? [...groups].map(([k, list]) => { const s = shops.get(k); return `
        <section class="my-shop" data-shop="${esc(k)}">
          <header><h3><a class="my-shop-name" href="#/shop/${encodeURIComponent(k)}">${esc(s.name)}</a></h3>
            <span class="count">이 가게 평균 ${s.avg.toFixed(1)}점 · 내 리뷰 ${list.length}개</span></header>
          ${list.map((r) => `
            <div class="my-review${photoAttrs(r)}"><div class="top-line">${stars(r.stars)} <span class="chip">${esc(r.menu)}</span> <time>${fmtDate(r.createdAt)}</time></div>
              ${r.text ? `<p class="r-text">${esc(r.text)}</p>` : ""}
              ${r.hasPhoto ? photoHTML(r, openPhotos.has(r.id)) : ""}
              ${r.comments.length ? `<p class="count">댓글 ${r.comments.length}개</p>` : ""}
              <div class="r-actions">${actionsHTML(r)}</div></div>`).join("")}
        </section>`; }).join("")
      : `<div class="panel empty" id="no-mine"><p>아직 남긴 리뷰가 없어요.</p><a class="btn primary" href="#/write">첫 리뷰 쓰기</a></div>`}`;
  }
  let owned = "";
  if (me) {
    const mineShops = groupShops().filter((x) => x.owner && x.owner.owner.id === me.id);
    owned = `
    <details class="panel" id="owner-panel"${mineShops.length ? " open" : ""}>
      <summary>가게 주인이신가요? 내 가게 등록하기</summary><div class="form">
      <form id="shop-form" class="row" novalidate>
        <label class="field grow"><span>가게 등록하기</span><input name="shop" maxlength="30" autocomplete="off" placeholder="가게 이름"></label>
        <button class="btn primary" type="submit">내 가게로 등록</button></form>
      <p class="msg" id="shop-msg" role="alert"></p>
      <p class="hint">리뷰가 이미 있는 가게도 이름을 똑같이 적으면 내 가게가 돼요. 먼저 등록한 사람이 주인이 되고, 진짜 주인인지 확인하는 방법은 아직 없어요.</p>
      ${mineShops.length ? `<ul class="owned-list" id="owned-list">${mineShops.map((x) => `<li><a href="#/shop/${encodeURIComponent(x.key)}">${esc(x.name)}</a> <span class="count">${x.count ? `리뷰 ${x.count}개 · 평균 ${x.avg.toFixed(1)}점` : "아직 리뷰가 없어요"}</span></li>`).join("")}</ul>${tempHTML(me.id)}`
        : `<p class="hint" id="no-owned">아직 등록한 내 가게가 없어요.</p>`}
    </div></details>`;
  }
  view.innerHTML = `
    <h1>${me ? "내 프로필" : "별명 정하기"}</h1>
    ${me ? "" : `<p class="sub" id="setup-note">처음 로그인했어요. 리뷰와 댓글에 보일 별명과 그림을 정해 주세요. 별명은 모두에게 보여요. (Google 이름과 메일은 저장하지 않아요)</p>`}
    <form id="profile-form" class="panel form" novalidate>
      <div class="preview" id="p-preview"></div>
      <label class="field"><span>별명</span><input name="name" maxlength="12" autocomplete="off" placeholder="실명 말고 별명을 써 주세요" value="${me ? esc(me.name) : ""}"></label>
      <fieldset><legend>프로필 그림</legend>
        <div class="pick" id="emoji-pick">${EMOJIS.map((e) => `<button type="button" class="emoji-btn" data-emoji="${e}" aria-label="그림 ${e}">${e}</button>`).join("")}</div></fieldset>
      <fieldset><legend>바탕색</legend>
        <div class="pick colors" id="color-pick">${COLORS.map((c, i) => `<button type="button" class="color-btn" data-color="${c}" aria-label="${COLOR_NAMES[i]}" style="background:${c}"></button>`).join("")}</div></fieldset>
      <p class="msg" id="form-msg" role="alert"></p>
      <div><button class="btn primary" type="submit">${me ? "프로필 고치기" : "별명 정하기"}</button></div>
    </form>
    ${owned}${mine}`;
  paintProfile();
}
function paintProfile() {
  const name = ($("#profile-form [name=name]") || {}).value || "";
  $("#p-preview").innerHTML = `${avatar({ emoji: pdraft.emoji, color: pdraft.color }, "lg")}<p><b>${esc(name.trim() || "별명을 적어 주세요")}</b></p>`;
  $$(".emoji-btn").forEach((b) => b.classList.toggle("on", b.dataset.emoji === pdraft.emoji));
  $$(".color-btn").forEach((b) => b.classList.toggle("on", b.dataset.color === pdraft.color));
}

// ── 눌렀을 때 · 쓸 때 · 보낼 때 ──
view.addEventListener("click", async (e) => {
  const pm = e.target.closest(".has-photo");
  if (pm && !e.target.closest("a, button")) { togglePhoto(pm); return; }
  const pickShop = e.target.closest(".pick-shop, .use-shop");
  if (pickShop) { const inp = $("#write-form [name=shop]"); inp.value = pickShop.dataset.name; paintShopHelp(); $("#write-form [name=menu]").focus(); return; }
  const del = e.target.closest(".del-btn");
  if (del) {
    del.closest(".r-actions").innerHTML = `<span class="hint">이 리뷰가 지워지고 되돌릴 수 없어요. (사진도 같이 지워져요)</span>
      <button type="button" class="btn small danger del-yes" data-id="${esc(del.dataset.id)}">지우기</button><button type="button" class="btn small del-no" data-id="${esc(del.dataset.id)}">취소</button>`;
    return;
  }
  const delNo = e.target.closest(".del-no");
  if (delNo) { const r = Store.getReviews().find((x) => x.id === delNo.dataset.id); if (r) delNo.closest(".r-actions").innerHTML = actionsHTML(r); return; }
  const delYes = e.target.closest(".del-yes");
  if (delYes) {
    const r = Store.getReviews().find((x) => x.id === delYes.dataset.id), key = r && r.shopKey;
    delYes.disabled = true;
    const res = await Store.deleteReview(delYes.dataset.id);
    if (!res.ok) { showError(res.message); delYes.disabled = false; return; }
    openPhotos.delete(delYes.dataset.id); toast("리뷰를 지웠어요.");
    if (location.hash.startsWith("#/shop/") && !groupShops().some((x) => x.key === key)) go("#/"); else route(true);
    return;
  }
  const star = e.target.closest(".star-btn");
  if (star) { wdraft.stars = +star.dataset.v; paintStars(); return; }
  const em = e.target.closest(".emoji-btn");
  if (em) { pdraft.emoji = em.dataset.emoji; paintProfile(); return; }
  const co = e.target.closest(".color-btn");
  if (co) { pdraft.color = co.dataset.color; paintProfile(); return; }
  const rb = e.target.closest(".react-btn");
  if (rb) {
    const y = window.scrollY, res = await Store.react(rb.dataset.review, rb.dataset.comment, rb.dataset.kind);
    if (!res.ok) { showError(res.message); return; }
    route(true); window.scrollTo(0, y); return;
  }
  const claim = e.target.closest("#claim-btn");
  if (claim) {
    claim.disabled = true;
    const res = await Store.registerShop(claim.dataset.shop);
    if (!res.ok) { showError(res.message); claim.disabled = false; return; }
    toast("내 가게로 등록했어요."); route(true); return;
  }
  if (e.target.closest(".photo-clear")) { wdraft.photo = null; $("#photo").value = ""; paintPhoto(); }
});
view.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("has-photo")) { e.preventDefault(); togglePhoto(e.target); }
});
view.addEventListener("input", (e) => {
  if (e.target.id === "q") { ui.q = e.target.value; paintShops(); }
  else if (e.target.closest("#write-form") && e.target.name === "shop") paintShopHelp();
  else if (e.target.closest("#profile-form") && e.target.name === "name") paintProfile();
});
view.addEventListener("change", async (e) => {
  if (e.target.id === "min") { ui.min = +e.target.value; paintShops(); }
  else if (e.target.id === "sort") { ui.sort = e.target.value; paintShops(); }
  else if (e.target.id === "photo") {
    const file = e.target.files[0];
    $("#form-msg").textContent = "";
    if (!file) { wdraft.photo = wdraft.editId ? wdraft.photo : null; paintPhoto(); return; }
    wdraft.busy = true;
    try { wdraft.photo = await shrink(file); }
    catch (err) { e.target.value = ""; $("#form-msg").textContent = "이 사진은 열 수 없어요. 다른 사진을 골라 주세요."; }
    wdraft.busy = false; paintPhoto();
  }
});
view.addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector("[type=submit]");
  if (btn) btn.disabled = true;                           // 두 번 눌러 두 번 저장되지 않게
  try {
    if (f.id === "write-form") await sendReview(f);
    else if (f.id === "profile-form") await sendProfile(f);
    else if (f.id === "shop-form") await sendShop(f);
    else if (f.classList.contains("c-form")) await sendComment(f);
  } finally { if (btn) btn.disabled = false; }
});
async function sendReview(f) {
  const msg = $("#form-msg"), v = (n) => f.elements[n].value.trim().replace(/[ \t]+/g, " ");
  let shop = v("shop"); const menu = v("menu"), text = f.elements.text.value.trim();
  const problem = !shop ? "가게 이름을 적어 주세요." : !menu ? "시킨 메뉴를 적어 주세요." : !wdraft.stars ? "별점을 눌러 주세요."
    : !text ? "리뷰를 한 줄이라도 적어 주세요." : wdraft.busy ? "사진을 줄이는 중이에요. 잠깐만 기다려 주세요." : "";
  if (problem) { msg.textContent = problem; return; }
  msg.textContent = "";
  const like = wdraft.editId ? null : findLookalike(shop, groupShops());      // 띄어쓰기만 다른 가게가 이미 있으면 그 가게로
  if (like) shop = like.name;
  const payload = { shop, menu, stars: wdraft.stars, text, photo: wdraft.photo };
  const res = wdraft.editId ? await Store.updateReview(wdraft.editId, payload) : await Store.addReview(payload);
  if (!res.ok) {
    if (res.duplicate) msg.innerHTML = `${esc(res.message)} <a href="#/write?edit=${encodeURIComponent(res.duplicate)}">내 리뷰 고치기</a>`;
    else msg.textContent = res.message;
    showError(res.message);
    return;
  }
  hideError();
  location.hash = "#/shop/" + encodeURIComponent(Store.shopKey(shop));
  toast((wdraft.editId ? "리뷰를 고쳤어요." : "리뷰를 남겼어요.") + (like ? ` 이미 있는 "${like.name}" 가게에 남겼어요.` : ""));
}
async function sendProfile(f) {
  const name = f.elements.name.value.trim().replace(/\s+/g, " ");
  if (!name) { $("#form-msg").textContent = "별명을 적어 주세요."; return; }
  const first = !Store.getProfile();
  const res = await Store.saveProfile({ name, emoji: pdraft.emoji, color: pdraft.color });
  if (!res.ok) { $("#form-msg").textContent = res.message; showError(res.message); return; }
  hideError();
  if (first) {                                      // 처음 별명을 정한 사람은 바로 다음 일로
    toast("별명을 정했어요. 이제 리뷰를 남겨 볼까요?");
    go(pnext.next === "write" ? "#/write" + (pnext.shop ? "?shop=" + encodeURIComponent(pnext.shop) : "") : "#/");
    return;
  }
  toast("프로필을 저장했어요.");
  route(true);
}
async function sendShop(f) {
  const typed = f.elements.shop.value.trim().replace(/\s+/g, " "), like = findLookalike(typed, groupShops());
  const res = await Store.registerShop(like ? like.name : typed);
  if (!res.ok) { $("#shop-msg").textContent = res.message; showError(res.message); return; }
  hideError(); toast("내 가게로 등록했어요."); route(true);
}
async function sendComment(f) {
  const text = f.elements.text.value.trim();
  if (!text) { f.elements.text.focus(); return; }
  const id = f.dataset.review, y = window.scrollY;
  const res = await Store.addComment(id, text);
  if (!res.ok) { showError(res.message); return; }
  hideError();
  route(true); window.scrollTo(0, y);
  const next = $(`.c-form[data-review="${CSS.escape(id)}"] input`); if (next) next.focus({ preventScroll: true });
}

route();
</script>
