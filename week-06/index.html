<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우리 동네 날씨</title>
  <meta name="description" content="평택시의 지금 날씨와 오늘 가장 높은 · 낮은 기온">
  <meta name="theme-color" content="#1d4ed8">
  <script>
    // 설치용 manifest 는 웹 주소(GitHub Pages)로 열었을 때만 붙여요.
    // 파일을 두 번 눌러 열면(file://) 브라우저가 manifest 를 막아서 오류가 나기 때문이에요.
    if (location.protocol.startsWith("http")) {
      const link = document.createElement("link");
      link.rel = "manifest";
      link.href = "manifest.webmanifest";
      document.head.appendChild(link);
    }
  </script>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="동네 날씨">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: #dbeafe;
      color: #0f172a;
      overflow-wrap: anywhere;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 24px;
      padding: clamp(20px, 6vw, 36px);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      text-align: center;
    }
    h1 { margin: 0; font-size: clamp(20px, 5.5vw, 26px); }
    .sub { margin: 4px 0 0; font-size: 14px; color: #475569; }

    .box { margin-top: 24px; }
    .now-temp { font-size: clamp(64px, 22vw, 96px); font-weight: 700; line-height: 1; margin: 0; }
    .now-word { font-size: clamp(28px, 9vw, 40px); font-weight: 700; margin: 8px 0 0; }
    .minmax {
      display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 20px;
      margin: 20px 0 0; font-size: 16px; color: #334155;
    }
    .high { color: #b91c1c; }
    .low { color: #1d4ed8; }
    .time { margin: 16px 0 0; font-size: 13px; color: #64748b; }

    .stale {
      margin: 0 0 20px; padding: 12px 14px; border-radius: 14px; text-align: left;
      background: #fffbeb; border: 1px solid #fcd34d; color: #78350f; font-size: 14px; line-height: 1.5;
    }
    .stale b { display: block; font-size: 15px; color: #92400e; }

    .days { display: flex; justify-content: center; gap: 8px; margin: 0 0 20px; }
    .days button {
      margin: 0; padding: 8px 20px; font-size: 15px;
      background: #e2e8f0; color: #334155;
    }
    .days button[aria-pressed="true"] { background: #1d4ed8; color: #fff; }
    .days button:disabled { background: #f1f5f9; color: #94a3b8; }

    .loading { font-size: 18px; color: #334155; padding: 24px 0; }
    .error { background: #fef2f2; border: 1px solid #fecaca; border-radius: 16px; padding: 20px; }
    .error h2 { margin: 0; font-size: 20px; color: #b91c1c; }
    .error p { margin: 8px 0 0; font-size: 15px; color: #7f1d1d; line-height: 1.5; }

    button {
      margin-top: 20px; font: inherit; font-size: 16px; padding: 12px 24px;
      border: 0; border-radius: 999px; background: #1d4ed8; color: #fff; cursor: pointer;
    }
    button:disabled { background: #94a3b8; cursor: default; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <h1>우리 동네 날씨</h1>
    <p class="sub">경기도 평택시</p>

    <div id="loading" class="box loading" role="status">날씨를 불러오는 중이에요…</div>

    <div id="weather" class="box" hidden>
      <p id="stale" class="stale" role="alert" hidden><b>지금 정보가 아니에요</b><span id="stale-why"></span></p>
      <div class="days" role="group" aria-label="날짜 고르기">
        <button type="button" id="day-today" aria-pressed="true">오늘</button>
        <button type="button" id="day-tomorrow" aria-pressed="false">내일</button>
      </div>
      <p class="now-temp" id="now-temp"></p>
      <p class="now-word" id="now-word"></p>
      <p class="minmax">
        <span><span id="day-label">오늘</span> 가장 높은 기온 <b class="high" id="high"></b></span>
        <span>가장 낮은 기온 <b class="low" id="low"></b></span>
      </p>
      <p class="time" id="time"></p>
    </div>

    <div id="error" class="box error" role="alert" hidden>
      <h2>날씨를 못 받아 왔어요</h2>
      <p id="error-why"></p>
    </div>

    <button id="reload" type="button">다시 불러오기</button>
  </main>

  <script>
    // 평택시 (Open-Meteo 지명 검색으로 찾은 위도 · 경도).
    // 날씨는 wttr.in 에서 받아요. API 키 없이 쓰는 주소예요.
    // (Open-Meteo 날씨 서버는 이 컴퓨터의 인터넷에서 연결이 안 돼서 바꿨어요.)
    const PLACE = { lat: 36.99472, lon: 127.08889 };
    const API = "https://wttr.in/" + PLACE.lat + "," + PLACE.lon + "?format=j1";
    const WAIT_LIMIT = 10000; // 10초 넘게 답이 없으면 포기

    // wttr.in 날씨 번호 → 한국어 낱말
    const WEATHER_WORDS = {
      113: "맑음", 116: "구름 조금", 119: "흐림", 122: "매우 흐림",
      143: "옅은 안개", 248: "안개", 260: "어는 안개",
      176: "곳에 따라 비", 179: "곳에 따라 눈", 182: "곳에 따라 진눈깨비",
      185: "곳에 따라 어는 이슬비", 200: "곳에 따라 천둥",
      227: "날리는 눈", 230: "눈보라",
      263: "곳에 따라 약한 이슬비", 266: "약한 이슬비",
      281: "어는 이슬비", 284: "강한 어는 이슬비",
      293: "곳에 따라 약한 비", 296: "약한 비", 299: "가끔 비", 302: "비",
      305: "가끔 강한 비", 308: "강한 비",
      311: "약한 어는 비", 314: "어는 비",
      317: "약한 진눈깨비", 320: "진눈깨비",
      323: "곳에 따라 약한 눈", 326: "약한 눈", 329: "곳에 따라 눈", 332: "눈",
      335: "곳에 따라 많은 눈", 338: "많은 눈",
      350: "싸락우박",
      353: "약한 소나기", 356: "소나기", 359: "강한 소나기",
      362: "약한 진눈깨비 소나기", 365: "진눈깨비 소나기",
      368: "약한 눈 소나기", 371: "눈 소나기",
      374: "약한 싸락우박 소나기", 377: "싸락우박 소나기",
      386: "곳에 따라 비와 천둥", 389: "비와 천둥",
      392: "곳에 따라 눈과 천둥", 395: "눈과 천둥",
    };
    function weatherWord(code) {
      return WEATHER_WORDS[code] || "알 수 없는 날씨 (번호 " + code + ")";
    }

    const $ = (id) => document.getElementById(id);

    function show(which) {
      $("loading").hidden = which !== "loading";
      $("weather").hidden = which !== "weather";
      $("error").hidden = which !== "error";
      $("reload").disabled = which === "loading";
    }

    // ── 마지막으로 받은 날씨 기억하기 (이 폰 · 이 브라우저 안에만 저장돼요) ──
    const SAVE_KEY = "pt-weather-last";
    function saveLast(w) {
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(w)); } catch (e) {}
    }
    function loadLast() {
      try {
        const w = JSON.parse(localStorage.getItem(SAVE_KEY));
        return w && typeof w.savedAt === "number" && [w.nowTemp, w.code, w.high, w.low].every(Number.isFinite) ? w : null;
      } catch (e) { return null; }
    }
    // 받은 때를 "11월 14일 오후 3:50" 처럼 한국 시간으로
    function whenText(ms) {
      return new Date(ms).toLocaleString("ko-KR", {
        timeZone: "Asia/Seoul", month: "long", day: "numeric", hour: "numeric", minute: "2-digit",
      });
    }

    // [오늘] [내일] 중 무엇을 보고 있는지, 지금 화면에 띄운 날씨와 까닭
    let day = "today";
    let shown = null, shownWhy = null;

    // 날씨 보여 주기. why 가 있으면 예전에 받은 정보라는 것과 그 까닭을 같이 보여 줘요
    function render(w, why) {
      shown = w; shownWhy = why;
      const hasTomorrow = !!w.tomorrow;
      if (!hasTomorrow) day = "today"; // 내일 정보가 없으면 내일 단추는 못 누름
      $("day-tomorrow").disabled = !hasTomorrow;
      $("day-tomorrow").title = hasTomorrow ? "" : "내일 날씨 정보가 없어요";
      $("day-today").setAttribute("aria-pressed", String(day === "today"));
      $("day-tomorrow").setAttribute("aria-pressed", String(day === "tomorrow"));

      const when = why ? whenText(w.savedAt) : "";
      if (day === "today") {
        $("now-temp").textContent = temp(w.nowTemp);
        $("now-word").textContent = weatherWord(w.code);
        $("high").textContent = temp(w.high);
        $("low").textContent = temp(w.low);
        $("day-label").textContent = why ? "그날" : "오늘";
        $("time").textContent = why ? when + "에 받음 · wttr.in" : koreaTime(w.obs) + " 관측 · wttr.in";
      } else {
        // 내일은 "지금" 기온이 없어서 낮 12시 예보를 크게 보여 줘요
        const t = w.tomorrow;
        $("now-temp").textContent = temp(t.noonTemp);
        $("now-word").textContent = weatherWord(t.noonCode);
        $("high").textContent = temp(t.high);
        $("low").textContent = temp(t.low);
        $("day-label").textContent = why ? "그다음 날" : "내일";
        $("time").textContent = (why ? when + "에 받은 " : "") + "내일 낮 12시 예보 · wttr.in";
      }
      if (why) $("stale-why").textContent = why + " 아래는 " + when + "에 받은 정보예요.";
      $("stale").hidden = !why;
      show("weather");
    }

    function pickDay(d) {
      day = d;
      if (shown) render(shown, shownWhy);
    }
    $("day-today").addEventListener("click", () => pickDay("today"));
    $("day-tomorrow").addEventListener("click", () => pickDay("tomorrow"));

    // 내일 날씨 꺼내기 (wttr.in 의 weather[1]). 빠진 게 있으면 null
    function readTomorrow(data) {
      const d = data && data.weather && data.weather[1];
      const noon = d && Array.isArray(d.hourly) && d.hourly.find((h) => String(h.time) === "1200");
      if (!d || !noon) return null;
      const raw = [noon.tempC, noon.weatherCode, d.maxtempC, d.mintempC];
      if (raw.some((v) => v === undefined || v === "")) return null;
      const [noonTemp, noonCode, high, low] = raw.map(Number);
      if ([noonTemp, noonCode, high, low].some(Number.isNaN)) return null;
      return { noonTemp, noonCode, high, low };
    }

    // 못 받아 왔을 때: 예전에 받은 게 있으면 그걸 까닭과 함께, 없으면 까닭만
    function showError(why) {
      const last = loadLast();
      if (last) { render(last, why); return; }
      $("error-why").textContent = why;
      show("error");
    }

    const temp = (n) => Math.round(n) + "°";

    // 관측 시각은 영국 시간("06:46 AM")으로 와서 한국 시간(+9시간)으로 바꿔요
    function koreaTime(utc) {
      const m = /^(\d{1,2}):(\d{2}) (AM|PM)$/.exec(utc || "");
      if (!m) return "관측 시각 모름";
      let h = Number(m[1]) % 12 + (m[3] === "PM" ? 12 : 0);
      h = (h + 9) % 24;
      return "오늘 " + String(h).padStart(2, "0") + ":" + m[2];
    }

    async function loadWeather() {
      show("loading");

      if (navigator.onLine === false) {
        showError("인터넷이 끊겨 있어요. 와이파이나 데이터를 켜면 새 날씨를 받아 와요.");
        return;
      }

      const stop = new AbortController();
      const timer = setTimeout(() => stop.abort(), WAIT_LIMIT);
      let res;
      try {
        res = await fetch(API, { signal: stop.signal });
      } catch (e) {
        clearTimeout(timer);
        showError(e.name === "AbortError"
          ? "날씨 서버가 " + WAIT_LIMIT / 1000 + "초 동안 답하지 않았어요. 잠시 뒤에 다시 해 보세요."
          : "날씨 서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.");
        return;
      }
      clearTimeout(timer);

      if (!res.ok) {
        showError("날씨 서버가 오류를 보냈어요 (번호 " + res.status + "). 잠시 뒤에 다시 해 보세요.");
        return;
      }

      let data;
      try {
        data = await res.json();
      } catch (e) {
        showError("날씨 서버가 보낸 내용을 읽지 못했어요.");
        return;
      }

      // wttr.in 은 숫자를 글자("12")로 보내서 숫자로 바꿔요
      const now = data && data.current_condition && data.current_condition[0];
      const day = data && data.weather && data.weather[0];
      const nowTemp = Number(now && now.temp_C);
      const code = Number(now && now.weatherCode);
      const high = Number(day && day.maxtempC);
      const low = Number(day && day.mintempC);
      if (!now || !day || [now.temp_C, now.weatherCode, day.maxtempC, day.mintempC].some((v) => v === undefined || v === "")
          || [nowTemp, code, high, low].some(Number.isNaN)) {
        showError("날씨 정보 중 빠진 것이 있어서 보여 줄 수 없어요.");
        return;
      }

      const w = { nowTemp, code, high, low, obs: now.observation_time, savedAt: Date.now(), tomorrow: readTomorrow(data) };
      saveLast(w);
      render(w, null);
    }

    $("reload").addEventListener("click", loadWeather);
    window.addEventListener("online", loadWeather); // 인터넷이 다시 켜지면 저절로 새로 받기
    loadWeather();

    // 폰에 설치되는 앱: 서비스 워커 등록 (파일을 두 번 눌러 열었을 때는 쓸 수 없어서 건너뜀)
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
