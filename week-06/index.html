<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우리 동네 날씨</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: #dbeafe;
      color: #0f172a;
      overflow-wrap: anywhere;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 24px;
      padding: clamp(20px, 6vw, 36px);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      text-align: center;
    }
    h1 { margin: 0; font-size: clamp(20px, 5.5vw, 26px); }
    .sub { margin: 4px 0 0; font-size: 14px; color: #475569; }

    .box { margin-top: 24px; }
    .now-temp { font-size: clamp(64px, 22vw, 96px); font-weight: 700; line-height: 1; margin: 0; }
    .now-word { font-size: clamp(28px, 9vw, 40px); font-weight: 700; margin: 8px 0 0; }
    .minmax {
      display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 20px;
      margin: 20px 0 0; font-size: 16px; color: #334155;
    }
    .high { color: #b91c1c; }
    .low { color: #1d4ed8; }
    .time { margin: 16px 0 0; font-size: 13px; color: #64748b; }

    .loading { font-size: 18px; color: #334155; padding: 24px 0; }
    .error { background: #fef2f2; border: 1px solid #fecaca; border-radius: 16px; padding: 20px; }
    .error h2 { margin: 0; font-size: 20px; color: #b91c1c; }
    .error p { margin: 8px 0 0; font-size: 15px; color: #7f1d1d; line-height: 1.5; }

    button {
      margin-top: 20px; font: inherit; font-size: 16px; padding: 12px 24px;
      border: 0; border-radius: 999px; background: #1d4ed8; color: #fff; cursor: pointer;
    }
    button:disabled { background: #94a3b8; cursor: default; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <h1>우리 동네 날씨</h1>
    <p class="sub">경기도 평택시</p>

    <div id="loading" class="box loading" role="status">날씨를 불러오는 중이에요…</div>

    <div id="weather" class="box" hidden>
      <p class="now-temp" id="now-temp"></p>
      <p class="now-word" id="now-word"></p>
      <p class="minmax">
        <span>오늘 가장 높은 기온 <b class="high" id="high"></b></span>
        <span>가장 낮은 기온 <b class="low" id="low"></b></span>
      </p>
      <p class="time" id="time"></p>
    </div>

    <div id="error" class="box error" role="alert" hidden>
      <h2>날씨를 못 받아 왔어요</h2>
      <p id="error-why"></p>
    </div>

    <button id="reload" type="button">다시 불러오기</button>
  </main>

  <script>
    // 평택시 (Open-Meteo 지명 검색으로 찾은 위도 · 경도).
    // 날씨는 wttr.in 에서 받아요. API 키 없이 쓰는 주소예요.
    // (Open-Meteo 날씨 서버는 이 컴퓨터의 인터넷에서 연결이 안 돼서 바꿨어요.)
    const PLACE = { lat: 36.99472, lon: 127.08889 };
    const API = "https://wttr.in/" + PLACE.lat + "," + PLACE.lon + "?format=j1";
    const WAIT_LIMIT = 10000; // 10초 넘게 답이 없으면 포기

    // wttr.in 날씨 번호 → 한국어 낱말
    const WEATHER_WORDS = {
      113: "맑음", 116: "구름 조금", 119: "흐림", 122: "매우 흐림",
      143: "옅은 안개", 248: "안개", 260: "어는 안개",
      176: "곳에 따라 비", 179: "곳에 따라 눈", 182: "곳에 따라 진눈깨비",
      185: "곳에 따라 어는 이슬비", 200: "곳에 따라 천둥",
      227: "날리는 눈", 230: "눈보라",
      263: "곳에 따라 약한 이슬비", 266: "약한 이슬비",
      281: "어는 이슬비", 284: "강한 어는 이슬비",
      293: "곳에 따라 약한 비", 296: "약한 비", 299: "가끔 비", 302: "비",
      305: "가끔 강한 비", 308: "강한 비",
      311: "약한 어는 비", 314: "어는 비",
      317: "약한 진눈깨비", 320: "진눈깨비",
      323: "곳에 따라 약한 눈", 326: "약한 눈", 329: "곳에 따라 눈", 332: "눈",
      335: "곳에 따라 많은 눈", 338: "많은 눈",
      350: "싸락우박",
      353: "약한 소나기", 356: "소나기", 359: "강한 소나기",
      362: "약한 진눈깨비 소나기", 365: "진눈깨비 소나기",
      368: "약한 눈 소나기", 371: "눈 소나기",
      374: "약한 싸락우박 소나기", 377: "싸락우박 소나기",
      386: "곳에 따라 비와 천둥", 389: "비와 천둥",
      392: "곳에 따라 눈과 천둥", 395: "눈과 천둥",
    };
    function weatherWord(code) {
      return WEATHER_WORDS[code] || "알 수 없는 날씨 (번호 " + code + ")";
    }

    const $ = (id) => document.getElementById(id);

    function show(which) {
      $("loading").hidden = which !== "loading";
      $("weather").hidden = which !== "weather";
      $("error").hidden = which !== "error";
      $("reload").disabled = which === "loading";
    }

    function showError(why) {
      $("error-why").textContent = why;
      show("error");
    }

    const temp = (n) => Math.round(n) + "°";

    // 관측 시각은 영국 시간("06:46 AM")으로 와서 한국 시간(+9시간)으로 바꿔요
    function koreaTime(utc) {
      const m = /^(\d{1,2}):(\d{2}) (AM|PM)$/.exec(utc || "");
      if (!m) return "관측 시각 모름";
      let h = Number(m[1]) % 12 + (m[3] === "PM" ? 12 : 0);
      h = (h + 9) % 24;
      return "오늘 " + String(h).padStart(2, "0") + ":" + m[2];
    }

    async function loadWeather() {
      show("loading");

      if (navigator.onLine === false) {
        showError("인터넷에 연결돼 있지 않아요. 와이파이나 데이터를 켠 뒤 '다시 불러오기'를 눌러 주세요.");
        return;
      }

      const stop = new AbortController();
      const timer = setTimeout(() => stop.abort(), WAIT_LIMIT);
      let res;
      try {
        res = await fetch(API, { signal: stop.signal });
      } catch (e) {
        clearTimeout(timer);
        showError(e.name === "AbortError"
          ? "날씨 서버가 " + WAIT_LIMIT / 1000 + "초 동안 답하지 않았어요. 잠시 뒤에 다시 해 보세요."
          : "날씨 서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.");
        return;
      }
      clearTimeout(timer);

      if (!res.ok) {
        showError("날씨 서버가 오류를 보냈어요 (번호 " + res.status + "). 잠시 뒤에 다시 해 보세요.");
        return;
      }

      let data;
      try {
        data = await res.json();
      } catch (e) {
        showError("날씨 서버가 보낸 내용을 읽지 못했어요.");
        return;
      }

      // wttr.in 은 숫자를 글자("12")로 보내서 숫자로 바꿔요
      const now = data && data.current_condition && data.current_condition[0];
      const day = data && data.weather && data.weather[0];
      const nowTemp = Number(now && now.temp_C);
      const code = Number(now && now.weatherCode);
      const high = Number(day && day.maxtempC);
      const low = Number(day && day.mintempC);
      if (!now || !day || [now.temp_C, now.weatherCode, day.maxtempC, day.mintempC].some((v) => v === undefined || v === "")
          || [nowTemp, code, high, low].some(Number.isNaN)) {
        showError("날씨 정보 중 빠진 것이 있어서 보여 줄 수 없어요.");
        return;
      }

      $("now-temp").textContent = temp(nowTemp);
      $("now-word").textContent = weatherWord(code);
      $("high").textContent = temp(high);
      $("low").textContent = temp(low);
      $("time").textContent = koreaTime(now.observation_time) + " 관측 · wttr.in";
      show("weather");
    }

    $("reload").addEventListener("click", loadWeather);
    loadWeather();
  </script>
</body>
</html>
