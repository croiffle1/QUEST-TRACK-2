<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>딸기 모으기 · 연습 게임</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d1b2a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Malgun Gothic", sans-serif; color: #fff; }
  #wrap { position: relative; }
  canvas { display: block; image-rendering: pixelated; }
  #hud { position: absolute; left: 12px; top: 8px; font-size: 22px; font-weight: bold; text-shadow: 2px 2px 0 #000; }
  #msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
         background: rgba(0, 0, 0, .45); font-size: 22px; line-height: 1.7; text-align: center; text-shadow: 2px 2px 0 #000; }
  #msg.hide { display: none; }
  #msg b { font-size: 34px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">🍓 0</div>
  <div id="msg">그림과 소리를 불러오는 중...</div>
</div>
<script>
// ── 화면 크기: 게임 안에서는 480×272, 창에 맞춰 정수 배로 키움 ──
const W = 480, H = 272, TILE = 16;
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");
const msg = document.getElementById("msg");
let scale = 1;
function resize() {
  scale = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H)));
  canvas.width = W * scale;
  canvas.height = H * scale;
  ctx.imageSmoothingEnabled = false; // 픽셀 아트가 흐려지지 않게 (최근접 필터)
}
addEventListener("resize", resize);
resize();

// ── 에셋 불러오기 (프레임 정보는 drop.json 에서 옮겨 적음) ──
const IMG = "assets/images/", SND = "assets/sounds/";
const FROG = {
  "idle":        { file: "ninja-frog_idle.png",        frames: 11, fps: 20, loop: true },
  "run":         { file: "ninja-frog_run.png",         frames: 12, fps: 20, loop: true },
  "jump":        { file: "ninja-frog_jump.png",        frames: 1,  fps: 20, loop: true },
  "double-jump": { file: "ninja-frog_double-jump.png", frames: 6,  fps: 20, loop: true },
  "fall":        { file: "ninja-frog_fall.png",        frames: 1,  fps: 10, loop: true },
  "wall-jump":   { file: "ninja-frog_wall-jump.png",   frames: 5,  fps: 20, loop: true },
  "hit":         { file: "ninja-frog_hit.png",         frames: 7,  fps: 20, loop: false },
};
const BERRY = { file: "strawberry_spin.png", frames: 17, fps: 12 };
const images = {};

function loadImage(name, file) {
  return new Promise((ok, fail) => {
    const im = new Image();
    im.onload = () => { images[name] = im; ok(); };
    im.onerror = () => fail(IMG + file);
    im.src = IMG + file;
  });
}

const sounds = {
  jump: new Audio(SND + "jump.wav"),
  coin: new Audio(SND + "coin.wav"),
  bgm:  new Audio(SND + "stage-1.ogg"),
};
sounds.bgm.loop = true; // 배경음악은 끝나면 처음부터 다시
sounds.bgm.volume = 0.4;
let muted = false;
function playSfx(name) {
  if (muted) return;
  const s = sounds[name].cloneNode(); // 겹쳐서 여러 번 나도록 복사해서 재생
  s.volume = 0.6;
  s.play().catch(() => {});
}

// ── 맵: # 은 땅 ──
const MAP = [
  "..............................",
  "..............................",
  "..............................",
  "..............................",
  "..............................",
  "..............................",
  ".....####........###........##",
  ".....####........###........##",
  "..............................",
  "...........####.......####....",
  "...........####.......####....",
  "..............................",
  "......###.........##..........",
  "......###.........##..........",
  "......###.........##..........",
  "##############################",
  "##############################",
];
const ROWS = MAP.length, COLS = MAP[0].length;
function isSolid(c, r) {
  if (c < 0 || c >= COLS || r >= ROWS) return true; // 화면 양옆과 아래는 벽
  if (r < 0) return false;
  return MAP[r][c] === "#";
}
// 타일셋의 풀 땅(왼쪽 위 칸이 6, 0)에서 이웃을 보고 모서리·가운데 칸을 고름
function tileFor(c, r) {
  const col = !isSolid(c - 1, r) ? 6 : !isSolid(c + 1, r) ? 8 : 7;
  const row = !isSolid(c, r - 1) ? 0 : !isSolid(c, r + 1) ? 2 : 1;
  return [col * TILE, row * TILE];
}

// ── 딸기 ──
// 딸기가 놓일 수 있는 자리: 빈 칸 중에서 1~3칸 아래에 밟을 땅이 있는 곳 (시작 자리 근처는 뺌)
const BERRY_COUNT = 15;
const BERRY_SPOTS = [];
for (let r = 0; r < ROWS; r++)
  for (let c = 0; c < COLS; c++) {
    if (isSolid(c, r) || (c <= 4 && r >= 12)) continue;
    let gap = 0;
    while (gap < 3 && !isSolid(c, r + gap + 1)) gap++;
    if (gap < 3) BERRY_SPOTS.push([c, r]);
  }
let berries = [];
// 새로 시작할 때마다 자리를 섞어서 서로 붙지 않게 15개를 고름
function spawnBerries() {
  const pool = [...BERRY_SPOTS];
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const picked = [];
  for (const [c, r] of pool) {
    if (picked.length === BERRY_COUNT) break;
    if (picked.some(([pc, pr]) => Math.abs(pc - c) < 2 && Math.abs(pr - r) < 2)) continue;
    picked.push([c, r]);
  }
  berries = picked.map(([c, r]) => ({ x: c * TILE + 8, y: r * TILE + 8 }));
}

// ── 개구리 ──
// x, y 는 몸통 상자의 왼쪽 위. 32×32 그림 안에서 몸통은 (6, 8) 부터 20×24
const player = { x: 40, y: 200, w: 20, h: 24, vx: 0, vy: 0, onGround: false,
                 jumpsLeft: 0, doubleJumping: false, facing: 1, anim: "idle", animTime: 0 };
const SPEED = 110, GRAVITY = 900, JUMP = 330, JUMP2 = 280, MAX_FALL = 400;

function overlapsSolid(x, y, w, h) {
  for (let r = Math.floor(y / TILE); r <= Math.floor((y + h - 0.001) / TILE); r++)
    for (let c = Math.floor(x / TILE); c <= Math.floor((x + w - 0.001) / TILE); c++)
      if (isSolid(c, r)) return true;
  return false;
}
function moveX(dx) {
  player.x += dx;
  if (!overlapsSolid(player.x, player.y, player.w, player.h)) return;
  if (dx > 0) player.x = Math.floor((player.x + player.w) / TILE) * TILE - player.w;
  else player.x = (Math.floor(player.x / TILE) + 1) * TILE;
}
function moveY(dy) {
  player.y += dy;
  player.onGround = false;
  if (!overlapsSolid(player.x, player.y, player.w, player.h)) return;
  if (dy > 0) { player.y = Math.floor((player.y + player.h) / TILE) * TILE - player.h; player.onGround = true; }
  else player.y = (Math.floor(player.y / TILE) + 1) * TILE;
  player.vy = 0;
}

// ── 키 ──
const keys = {};
let jumpPressed = false, started = false;
addEventListener("keydown", (e) => {
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(e.code)) e.preventDefault();
  if (!loaded) return;
  if (!started) { // 브라우저는 키를 한 번 눌러야 소리를 내 줌
    started = true;
    msg.classList.add("hide");
    if (!muted) sounds.bgm.play().catch(() => {});
    return;
  }
  keys[e.code] = true;
  if (e.code === "Space" && !e.repeat) jumpPressed = true;
  if (e.code === "KeyM") {
    muted = !muted;
    sounds.bgm.muted = muted;
    if (!muted) sounds.bgm.play().catch(() => {});
  }
});
addEventListener("keyup", (e) => { keys[e.code] = false; });

// ── 점수 ──
let score = 0, clearTimer = 0;

function update(dt) {
  const dir = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
  player.vx = dir * SPEED;
  if (dir) player.facing = dir;

  if (jumpPressed) {
    if (player.onGround) {
      player.vy = -JUMP; player.jumpsLeft = 1; playSfx("jump");
    } else if (player.jumpsLeft > 0) { // 공중에서 한 번 더
      player.vy = -JUMP2; player.jumpsLeft = 0; player.doubleJumping = true; player.animTime = 0; playSfx("jump");
    }
  }
  jumpPressed = false;

  player.vy = Math.min(player.vy + GRAVITY * dt, MAX_FALL);
  moveX(player.vx * dt);
  moveY(player.vy * dt);
  if (player.onGround) player.jumpsLeft = 0;
  if (player.onGround || player.vy >= 0) player.doubleJumping = false;

  // 어떤 애니메이션을 보여 줄지
  let anim;
  if (player.onGround) anim = dir ? "run" : "idle";
  else if (player.doubleJumping) anim = "double-jump";
  else anim = player.vy < 0 ? "jump" : "fall";
  if (anim !== player.anim) { player.anim = anim; player.animTime = 0; }
  player.animTime += dt;

  // 딸기 먹기
  const cx = player.x + player.w / 2, cy = player.y + player.h / 2;
  berries = berries.filter((b) => {
    const hit = Math.abs(b.x - cx) < player.w / 2 + 6 && Math.abs(b.y - cy) < player.h / 2 + 6;
    if (hit) { score++; playSfx("coin"); }
    return !hit;
  });
  if (berries.length === 0 && clearTimer === 0) clearTimer = 1.2;
  if (clearTimer > 0) {
    clearTimer -= dt;
    if (clearTimer <= 0) { clearTimer = 0; spawnBerries(); }
  }
  hud.textContent = "🍓 " + score + (clearTimer > 0 ? "   다 모았어요! 딸기가 다른 곳에 다시 나와요" : "");
}

function frameOf(anim, time) {
  const f = Math.floor(time * anim.fps);
  return anim.loop === false ? Math.min(f, anim.frames - 1) : f % anim.frames;
}
function drawSheet(img, frame, x, y, flip) {
  x = Math.round(x); y = Math.round(y);
  if (flip) {
    ctx.save();
    ctx.translate(x + 32, y);
    ctx.scale(-1, 1);
    ctx.drawImage(img, frame * 32, 0, 32, 32, 0, 0, 32, 32);
    ctx.restore();
  } else {
    ctx.drawImage(img, frame * 32, 0, 32, 32, x, y, 32, 32);
  }
}

function draw(time) {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.imageSmoothingEnabled = false;

  // 배경: 64×64 무늬를 깔고 천천히 아래로 흘림
  const off = (time * 16) % 64;
  for (let y = -64 + off; y < H; y += 64)
    for (let x = 0; x < W; x += 64)
      ctx.drawImage(images.bg, x, Math.round(y));

  // 땅
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (MAP[r][c] === "#") {
        const [sx, sy] = tileFor(c, r);
        ctx.drawImage(images.tiles, sx, sy, TILE, TILE, c * TILE, r * TILE, TILE, TILE);
      }

  // 딸기
  const bf = frameOf(BERRY, time);
  for (const b of berries) drawSheet(images.berry, bf, b.x - 16, b.y - 16, false);

  // 개구리
  const a = FROG[player.anim];
  drawSheet(images[player.anim], frameOf(a, player.animTime), player.x - 6, player.y - 8, player.facing < 0);
}

// ── 시작 ──
let loaded = false, last = 0;
function loop(now) {
  const t = now / 1000;
  const dt = Math.min(t - last, 1 / 30); // 창을 잠깐 내려도 튀지 않게
  last = t;
  if (started) update(dt);
  draw(t);
  requestAnimationFrame(loop);
}

Promise.all([
  ...Object.entries(FROG).map(([name, a]) => loadImage(name, a.file)),
  loadImage("berry", BERRY.file),
  loadImage("tiles", "terrain-tileset.png"),
  loadImage("bg", "blue-pattern-background.png"),
]).then(() => {
  loaded = true;
  spawnBerries();
  msg.innerHTML = "<b>🍓 딸기 모으기</b>← → 움직이기 · 스페이스 점프 (공중에서 한 번 더!)<br>M 소리 끄기/켜기<br><br>아무 키나 눌러서 시작";
  requestAnimationFrame((now) => { last = now / 1000; loop(now); });
}).catch((path) => {
  msg.textContent = "그림을 못 불러왔어요: " + path;
});
</script>
</body>
</html>
